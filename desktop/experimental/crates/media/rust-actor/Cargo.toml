[package]
name = "mnema-private-synthetic-media-actor"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default = []
synthetic-media-fixture = ["mnema-private-native-client-broker/synthetic-media-fixture", "mnema-private-synthetic-media-policy/synthetic-media-fixture"]

[dependencies]
mnema-private-native-client-broker = { path = "../../broker" }
mnema-private-synthetic-media-policy = { path = "../rust" }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.27.0", features = ["v4"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.190"
