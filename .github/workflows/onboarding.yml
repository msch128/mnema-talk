name: Onboarding

# The newcomer path, tested against the docs themselves. Runs on pull requests
# that touch the docs, the compose file, the setup assistant or the setup
# checks (and on main). The docs are the test input:
#   - the `docker run ... setup` lines of the quick-start docs are executed and
#     the generated .env and docker-compose.yml are checked;
#   - the Caddy and nginx snippets of the operations doc run in front of the
#     app: HTTPS, the /api/ws upgrade and the Status tab's proxy warning.
# Blocks are found by the markers described in scripts/doc-blocks.mjs. The
# static checks (stale versions, setup check codes, ports) run in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - README.md
      - doc/**
      - docker-compose.yml
      - .env.example
      - Dockerfile
      - api/status-codes.json
      - internal/setupwizard/**
      - internal/setupcheck/**
      - internal/opwarn/**
      - internal/httpx/middleware_clientip.go
      - scripts/doc-blocks.mjs
      - scripts/onboarding*
      - scripts/free-port.sh
      - .github/workflows/onboarding.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only, from the layers ci.yml saved for the same Dockerfile.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/mnema-talk.tar
          tags: mnema-talk:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-image
          path: ${{ runner.temp }}/mnema-talk.tar
          retention-days: 1

  setup-assistant:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onboarding-image
          path: ${{ runner.temp }}

      - run: docker load -i "$RUNNER_TEMP/mnema-talk.tar"

      # Synology, Unraid, VPS and flag lines from the docs, then
      # .env keys and secrets, `docker compose config`, no overwrite.
      - name: Setup assistant command lines from the docs
        run: python3 scripts/onboarding_wizard_check.py mnema-talk:ci

  proxy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proxy: [caddy, nginx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onboarding-image
          path: ${{ runner.temp }}

      - run: docker load -i "$RUNNER_TEMP/mnema-talk.tar"

      - name: Proxy matrix (${{ matrix.proxy }})
        run: scripts/onboarding-proxy-check.sh "${{ matrix.proxy }}" mnema-talk:ci
