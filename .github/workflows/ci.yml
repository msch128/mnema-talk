name: CI

on:
  push:
    branches: [main]
  pull_request:
    # release-please's PRs only bump these files and are merged right away by
    # release.yml; CI runs on the resulting push to main instead.
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json

permissions:
  contents: read

# Pull requests: a new push cancels the superseded run. Pushes to main get one
# group per commit and are never cancelled: release.yml runs on the
# `workflow_run` completion of this workflow, and a cancelled run on main would
# neither release nor save the caches that pull requests restore from.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Keep in sync with GOVULNCHECK_VERSION in the Makefile.
  GOVULNCHECK_VERSION: v1.8.0
  CARGO_AUDIT_VERSION: 0.22.2
  TRIVY_VERSION: 0.75.0
  # sha256 of trivy_0.75.0_Linux-64bit.tar.gz from the upstream checksums.txt
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  # -- Secret scan: the whole tree plus the commits this push/PR adds --------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: gitleaks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # -- Backend: vet, format, unit + integration tests, build -----------------
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mnema
          POSTGRES_PASSWORD: mnema
          POSTGRES_DB: mnema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnema -d mnema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the service container above.
      TEST_DATABASE_URL: postgres://mnema:mnema@localhost:5432/mnema_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-backend-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-backend-${{ steps.go.outputs.go-version }}-

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal web/web.go)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: OpenAPI description is up to date
        run: make openapi-check

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Backup and restore fault tests
        run: make test-scripts

      # Runs unit and integration tests together and records which code they
      # reach: the coverage report (job summary + artifact) counts both.
      - name: Integration tests (with coverage)
        run: make coverage-go

      # make coverage-go fails below 98 %; the summary and the report are
      # still published then, so the job summary shows what is missing.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: node scripts/coverage-summary.mjs go coverage.out --min 98 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/server

  # -- Go vulnerability scan (reachable symbols only) ------------------------
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-govulncheck-${{ steps.go.outputs.go-version }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-govulncheck-${{ steps.go.outputs.go-version }}-

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # -- Frontend: lint, test, build, audit ------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Browser test compiler dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Generated frontend contracts are up to date
        run: npm run contracts:check
      - name: Strict TypeScript checks
        run: npm run typecheck
      - name: Strict browser test TypeScript checks
        working-directory: e2e
        run: npm run typecheck
      - run: npm run test:coverage

      # Require 95% on all four totals and all modules; reviewed per-module
      # exceptions may lower individual thresholds to 80%, never the totals.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: npm run coverage:check >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: |
            web/coverage/lcov.info
            web/coverage/coverage-final.json
            web/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - run: npm run build
      - name: npm audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high

  # -- Unsigned development probe; does not qualify gaming or E2EE -----------
  desktop-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Frontend dependencies, tests and local-asset build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run check
          npm audit --prefix desktop/ui --omit=dev --audit-level=high
      - name: Rust format, tests and native checks
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.0 fmt --manifest-path desktop/Cargo.toml --check
          cargo +1.99.0 test --locked --manifest-path desktop/Cargo.toml
          cargo +1.99.0 clippy --locked --manifest-path desktop/Cargo.toml --all-targets --features shell -- -D warnings
      - name: Build unsigned feasibility probe (not a release)
        run: npm --prefix desktop run build
      - name: Verify distribution notices and development manifest tests
        shell: bash
        run: |
          set -euo pipefail
          node --test desktop/scripts/*.test.mjs
          node desktop/scripts/collect-licenses.mjs --check
      - name: Rust advisory scan (pinned tool; no advisory ignores)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.0 install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit --file desktop/Cargo.lock
      - name: Upload Windows probe for qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-feasibility-probe
          path: |
            desktop/target/release/mnema-desktop-probe.exe
            desktop/README.md
            desktop/THIRD_PARTY_NOTICES.md
            desktop/licenses/
            LICENSE
          if-no-files-found: error
          retention-days: 7

  # -- Container image (build only, never pushed) ----------------------------
  # Same platforms as the release image, so a Dockerfile change that breaks
  # one of them fails here and not in the release. The Go binary is
  # cross-compiled on the runner (no QEMU), so arm64 adds about one compile.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: mnema-talk:ci
          # VERSION stays empty: the image reports version.txt, like a local build.
          build-args: |
            REVISION=${{ github.sha }}
          # Same scope as the release image build (release.yml), which then
          # reuses these layers from main.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # The runner's architecture again, from the cache above, into the local
      # Docker daemon for the smoke test and the scan.
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mnema-talk:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image

      # The production docker-compose.yml with throwaway secrets: healthcheck,
      # /api/health and an admin login against the real image.
      - name: Smoke test (compose stack)
        run: scripts/smoke-image.sh mnema-talk:ci

      # scripts/backup.sh and restore.sh (--verify and --yes) end to end:
      # seeded message and upload come back, later changes are gone.
      - name: Backup/restore drill (compose stack)
        run: scripts/backup-drill.sh mnema-talk:ci

      # Mnema Talk 0.4 ran PostgreSQL 17 on another volume: the current
      # compose file must refuse to start on it, and upgrade-postgres.sh
      # must carry the data over.
      - name: PostgreSQL 17 -> 18 upgrade drill
        run: scripts/postgres-upgrade-drill.sh mnema-talk:ci

      - name: Install trivy (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      # Fixable HIGH/CRITICAL vulnerabilities in the OS packages and the Go
      # binary fail the build (and so the release, which waits for CI).
      - name: Scan image
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress mnema-talk:ci

  # -- Browser smoke test: login, chat message, talk, against the real binary -
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # Browsers only; the system packages are still installed by
      # `playwright install --with-deps` in e2e/run.sh, which skips the
      # browser download when the cached revision is present.
      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' e2e/package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Run browser smoke test
        env:
          E2E_INSTALL_BROWSER: "1"
        run: e2e/run.sh

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/server.log
          if-no-files-found: ignore
          retention-days: 7
