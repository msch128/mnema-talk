# Deferred: chrislusf/seaweedfs stays on 4.48 for 1.2 (4.50 was one day old with
# listen, raft and fsync behaviour changes); re-check at least 2 weeks after 4.50.
# Weekly dependency updates, grouped so each ecosystem yields one PR.
# Security updates are opened immediately regardless of this schedule.
# Go and npm updates wait 5 days after a release (cooldown) so a hijacked or
# yanked version is usually caught before it reaches a PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # Replaced by dockertest/v4.
      - dependency-name: github.com/ory/dockertest/v3

  # Load-test client (own module, not shipped).
  - package-ecosystem: gomod
    directory: /loadtest/viewer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      loadtest-go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      npm-runtime:
        dependency-type: production
      npm-dev:
        dependency-type: development
    ignore:
      # Deprecated upstream; the app uses @lucide/vue.
      - dependency-name: lucide-vue-next
      # TypeScript 7 (native compiler) was tried on 2026-10-23 and does not run
      # here: typescript-eslint 8.72 peers typescript <6.1 and ESLint crashes in
      # ts-api-utils ("Cannot read properties of undefined (reading 'Intrinsic')"),
      # and vue-tsc 3.3.13 fails with ERR_PACKAGE_PATH_NOT_EXPORTED for
      # typescript/lib/tsc. Move when both support it (typescript-eslint #10940).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node major of the build image (node:26 in Dockerfile and CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-mls 1.6.4 pins @noble/curves 2.0.1 and @noble/ciphers 2.1.1 as exact
      # peers (2.4.0 of both makes npm ci fail with ERESOLVE); they move only with
      # ts-mls. @noble/hashes is not a peer.
      - dependency-name: "@noble/curves"
      - dependency-name: "@noble/ciphers"
      # The CSP build patch (web/scripts/emojiPickerCsp.ts) depends on the
      # exact 1.29.1 build.
      - dependency-name: emoji-picker-element

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node majors (build only) are bumped deliberately, together with CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A Postgres major upgrade needs a dump/restore or pg_upgrade of the data
      # volume; do it deliberately, never via an automatic PR.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
