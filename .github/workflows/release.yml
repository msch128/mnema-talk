name: Release

# Continuous delivery for main.
#
# Triggered by `workflow_run` when the CI workflow finishes, so nothing here
# runs unless CI passed for that exact push to main. This keeps ci.yml
# unchanged and avoids running the whole CI suite twice (a reusable-workflow
# call would duplicate it on every push). The image is built from the new
# release tag, i.e. the merge commit of the release PR that CI just tested.
#
# Note: release PRs opened with GITHUB_TOKEN start no workflows, but main's
# ruleset requires a pull request with the CI and CodeQL checks. This job
# therefore reports the result of the CI run it was triggered by as commit
# statuses on the release commit (after checking that the PR only touches
# version.txt, CHANGELOG.md and the manifest and sits directly on the tested
# commit) and then merges it. The statuses are not a fixed list: for every
# check that main's ruleset requires, the conclusion of that check on the
# tested commit is mirrored (scripts/release-checks.py), and the PR is not
# merged if one of them did not succeed.
#
# 1. release-please opens/updates a release PR from conventional commits.
#    Every green push to main is released: the job merges that release PR
#    right away and runs release-please a second time, which creates the
#    GitHub Release + tag vX.Y.Z. (A merge made with GITHUB_TOKEN triggers
#    no new workflow run, so the release has to happen in this same job.)
#    The release commit only changes version.txt and CHANGELOG.md.
# 2. The server ships only as a Docker image for linux/amd64 and linux/arm64,
#    cross-compiled without QEMU and pushed to GHCR as
#    :X.Y.Z, :X.Y and :latest, with OCI labels plus BuildKit provenance and
#    SBOM attestations attached to the image.
#    Windows Desktop DEV builds live in msch128/mnema-talk-desktop.
#    Releases through v0.7.3 keep the ZIP that was attached here.
#
# Deploying to the self-hosted server stays manual/pull-based (see README).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      version: ${{ steps.release.outputs.version || steps.publish.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
    steps:
      # CI runs for pushes to main are never cancelled (ci.yml), so an older
      # push can finish green after a newer one landed. release-please always
      # works on main's tip, so only the run for the tip may release; the run
      # for the newer push decides about it.
      - name: Check that CI tested main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI tested $TESTED but main is at $tip; the run for the newer commit releases."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.tip.outputs.current == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # The script that decides which checks to mirror comes from the tested
      # commit itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.pr != ''
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: scripts/release-checks.py

      # Release every green main: merge the release PR that was just
      # opened or updated ...
      - name: Merge release PR
        id: merge
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Read in the script: fromJSON on an empty output breaks the whole
          # job when the tip guard skipped release-please.
          PR_JSON: ${{ steps.release.outputs.pr }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        # Only ever merge release-please's own PR, opened by the Actions bot on
        # its branch and touching nothing but the version and changelog.
        # GitHub may still be computing mergeability right after the update.
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r .number <<<"$PR_JSON")
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,author,files,isCrossRepository,title)
          head=$(jq -r .headRefName <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          cross=$(jq -r .isCrossRepository <<<"$pr")
          files=$(jq -r '.files[].path' <<<"$pr" | sort | tr '\n' ' ')
          echo "PR #$PR_NUMBER head=$head author=$author files=$files"
          case "$head" in release-please--*) ;; *) echo "::error::not a release-please branch"; exit 1 ;; esac
          case "$author" in app/github-actions|github-actions\[bot\]|github-actions) ;; *) echo "::error::unexpected author $author"; exit 1 ;; esac
          [ "$cross" = "false" ] || { echo "::error::cross-repository PR"; exit 1; }
          for f in $files; do
            case "$f" in version.txt|CHANGELOG.md|.release-please-manifest.json) ;; *) echo "::error::unexpected file $f"; exit 1 ;; esac
          done
          # release-please finds the last release by its tag commit in main's
          # history. If main was rewritten (force push) that commit is gone and
          # it proposes an already released version again, with the whole
          # history as changelog. Stop here instead of merging that.
          version=$(jq -r .title <<<"$pr" | sed -nE 's/^chore\(main\): release ([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p')
          [ -n "$version" ] || { echo "::error::cannot read the version from the PR title"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$version already exists; release-please lost the last release (was main rewritten?)"
            exit 1
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$latest" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...main" --jq .status)
            case "$status" in ahead|identical) ;; *)
              echo "::error::$latest is not in main's history (compare: $status); main was rewritten after that release"
              exit 1 ;;
            esac
          fi
          # Main may have moved while release-please ran; merging now would
          # release a commit CI hasn't passed yet.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$TESTED" ]; then
            echo "::notice::main moved to $tip; leaving the release to the CI run for that commit"
            exit 0
          fi
          # main's ruleset requires the CI and CodeQL checks on every pull
          # request, but a PR opened with GITHUB_TOKEN starts no workflows.
          # The release commit sits directly on the commit CI just passed and
          # only touches the files checked above, so report that run's result
          # for it.
          sha=$(jq -r .headRefOid <<<"$pr")
          parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents | map(.sha) | join(" ")')
          if [ "$parent" != "$TESTED" ]; then
            echo "::notice::release PR is based on $parent, not $TESTED; leaving it for the next CI run"
            exit 0
          fi
          # Mirror what main's ruleset requires, not a list kept here: read the
          # required contexts from the ruleset and the conclusions from the
          # check runs of the tested commit. A context that did not succeed
          # there is never reported, and the PR is not merged. CodeQL may
          # still be running when CI completes, so wait for pending ones for up
          # to 30 minutes (60 x 30 s); after that the job fails closed.
          work=$(mktemp -d)
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$work/rules.json"
          decided=1
          for _ in $(seq 1 60); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$TESTED/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion}' > "$work/runs.jsonl"
            set +e
            python3 scripts/release-checks.py "$work/rules.json" "$work/runs.jsonl" > "$work/decision.tsv"
            decided=$?
            set -e
            [ "$decided" -eq 3 ] || break
            sleep 30
          done
          cat "$work/decision.tsv"
          if [ "$decided" -ne 0 ]; then
            echo "::error::required checks did not all succeed on ${TESTED:0:7}; not merging the release PR"
            exit 1
          fi
          while IFS=$'\t' read -r check state; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="$check" \
              -f description="version and changelog only; mirrored from ${TESTED:0:7}" \
              -f target_url="$RUN_URL" >/dev/null
          done < "$work/decision.tsv"
          for _ in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$sha"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      # ... and publish it (tag + GitHub Release) in the same run.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: publish
        if: steps.merge.outputs.merged == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature (Sigstore), this job only
    env:
      IMAGE: ghcr.io/msch128/mnema-talk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Source revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mnema Talk
            org.opencontainers.image.description=Lightweight single-server chat with voice and screenshare
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          # Keep in sync with ci.yml's docker job. linux/arm/v7 is left out:
          # the server doesn't compile for 32-bit targets yet (see README).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
          provenance: mode=max
          sbom: true
          # Shares the scope with ci.yml's docker job: the web stage and the
          # module download come from the CI build of this commit on main.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Signs the digest that was just pushed (all tags point at it) with the
      # workflow's OIDC identity; verification is in doc/operations.md.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # The desktop client runs a signed bundle of the web app instead of the
  # server's JavaScript (doc/desktop-trusted-client.md). One job builds and
  # signs, in the protected environment, so the signed bytes never come from
  # an unprivileged job or from an artifact handed over between jobs:
  #   - web/dist is built here from the release tag by `npm ci --ignore-scripts`
  #     and `npm run build`, each inside a throwaway container (the same
  #     digest-pinned node image as the Dockerfile's web stage) that gets no
  #     secret, no Docker socket, no host mount except a copy of web/, and for
  #     the build itself no network. Build-time code from a dependency can only
  #     change files in that copy; it cannot touch this job's environment,
  #     PATH, outputs or the signing step.
  #   - The key reaches the single `webbundle build` step only. The tool is
  #     built from the tag's own Go source in an earlier step without the key.
  #   - Without the secret (forks) nothing is built or signed and the job
  #     succeeds.
  # Residual risk (doc/desktop-trusted-client.md): a poisoned dependency that
  # is already in package-lock.json still lands in the build output, because
  # the image build uses the same lockfile. The lockfile pins every package
  # with an integrity hash, Dependabot waits out a cooldown, and the manifest
  # hash is printed for an independent rebuild.
  web-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: web-bundle-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Is a signing key configured?
        id: key
        env:
          KEY: ${{ secrets.WEB_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WEB_BUNDLE_SIGNING_KEY is not set; the desktop bundle is not built."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # Both containers run as the runner's user with no capabilities, no
      # inherited environment and only the build copy mounted. The install
      # needs the registry; the build runs with the network disabled.
      - name: Build the web app in a sealed container
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          image=$(grep -E '^FROM .* AS web$' Dockerfile | tr ' ' '\n' | grep '^node:')
          case "$image" in node:*@sha256:*) ;; *) echo "::error::cannot find the pinned node image in the Dockerfile"; exit 1 ;; esac
          work="$RUNNER_TEMP/web-build"
          mkdir -p "$work"
          cp -a web "$work/web"
          cp version.txt "$work/version.txt"
          rm -rf "$work/web/dist" "$work/web/node_modules"
          sandbox=(--rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges
            --env HOME=/tmp --mount "type=bind,src=$work,dst=/work" --workdir /work/web)
          docker run "${sandbox[@]}" "$image" npm ci --ignore-scripts --no-audit --no-fund
          docker run "${sandbox[@]}" --network none --env "MNEMA_VERSION=$VERSION" "$image" npm run build
          test -s "$work/web/dist/index.html"
          echo "WEB_DIST=$work/web/dist" >> "$GITHUB_ENV"

      # Built from the tag's Go source here, never from the artifact, and
      # without the signing key in the environment.
      - name: Build the bundle tool
        if: steps.key.outputs.present == 'true'
        run: go build -o "$RUNNER_TEMP/webbundle" ./cmd/webbundle

      # A release that contains a security fix raises the floor to itself, so
      # desktop clients stop running every older bundle. A fix says so with an
      # explicit `Security-Floor: raise` trailer in its commit message
      # (scripts/security-floor.sh; the commit subject plays no part).
      - name: Decide the security floor
        if: steps.key.outputs.present == 'true'
        id: floor
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          if [ "$(sh scripts/security-floor.sh "$range")" = raise ]; then floor="$VERSION"; else floor=""; fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "Security floor raised to: ${floor:-not raised (web/desktop-compat.json applies)} (range $range)" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the bundle
        if: steps.key.outputs.present == 'true'
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          WEB_BUNDLE_SIGNING_KEY: ${{ secrets.WEB_BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/webbundle" build -dir "$WEB_DIST" -compat web/desktop-compat.json \
            -version "$VERSION" -commit "$(git rev-parse HEAD)" -security-floor "$FLOOR" -out bundle

      - name: Verify the bundle
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/webbundle" verify -zip "bundle/mnema-web-$VERSION.zip" -pub web/desktop-signing.pub
          {
            echo "### Desktop bundle $VERSION"
            echo
            echo "manifest sha256: \`$(sha256sum bundle/manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the bundle to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "bundle/mnema-web-$VERSION.zip" bundle/manifest.json bundle/manifest.sig \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The server releases carry the Docker image and the signed web bundle, not
  # desktop installers (those come from the desktop repository). Say so in the
  # release body, so nobody looks for a download that is not here. Idempotent:
  # the marker comment keeps a rerun from appending the section twice.
  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Append the desktop app section
        run: |
          set -eu
          marker='<!-- desktop-app-section -->'
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$body" in *"$marker"*) echo "section already present"; exit 0 ;; esac
          # The releases page, not one tag: a tag URL freezes whatever was
          # current when this server release was published.
          url="https://github.com/msch128/mnema-talk-desktop/releases"
          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '%s\n\n' "### Desktop app (Beta)"
            printf '%s\n' "The desktop app (Beta, unsigned) for Windows, macOS and Linux is published in its own repository: [latest desktop release]($url)."
            printf '%s\n' "This server release carries the Docker image (\`ghcr.io/msch128/mnema-talk:$VERSION\`) and the signed web bundle that the desktop app verifies, not desktop installers."
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
