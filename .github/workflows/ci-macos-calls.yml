name: CI (macOS calls)

# The call specs on macOS WebKit run in their own workflow: they are slow and
# flaky on hosted macOS runners and not a required check, and release.yml
# releases on the completion of the "CI" workflow, so a timeout here must not
# hold back a release.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -- The call specs on WebKit. Playwright's Linux WebKit has no
  # RTCRtpScriptTransform, so they cannot run in `e2e (webkit)`; macOS WebKit
  # (the engine of Safari) has it. macOS runners have no Docker, so PostgreSQL
  # and SeaweedFS run as local processes (E2E_NO_DOCKER). Not a required check.
  # The hosted runner has two cores and no GPU: the specs that encode a 720p/1080p
  # screen in three simulcast layers or poll a 1080p sender's stats (screen-layers,
  # "stream quality") wedge it, so they run on Chromium and Linux WebKit only.
  e2e-webkit-macos:
    name: e2e (webkit-macos-calls, ${{ matrix.group.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    # A hosted macOS runner that runs the call specs one after another wedges
    # after some twenty minutes (it stops answering, so not even a timeout
    # reports). The specs are therefore split over short jobs, each on a fresh
    # runner.
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: sealing
            specs: browser-sealing.spec.ts key-lifecycle.spec.ts late-join.spec.ts
          - name: screen
            specs: screenshare.spec.ts stage-switch.spec.ts
          - name: talk
            specs: talk-extras.spec.ts voice-chat.spec.ts
          - name: basics
            specs: smoke.spec.ts roles.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # Homebrew can hiccup on the network: a bounded retry, nothing else.
      - name: Install PostgreSQL and SeaweedFS
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            brew install postgresql@18 seaweedfs && break
            echo "brew install failed (attempt $attempt)" >&2
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          echo "E2E_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"

      - name: Run the call specs on macOS WebKit
        # A hang must end this step (and keep its log), not the job.
        timeout-minutes: 15
        env:
          # Playwright ends the run itself, with the results so far, before the step does.
          E2E_GLOBAL_TIMEOUT_MS: "720000"
          E2E_NO_DOCKER: "1"
          E2E_INSTALL_BROWSER: "1"
          E2E_BROWSERS: webkit
          E2E_ONLY: "--project=webkit --grep-invert=picks.the.stream.quality ${{ matrix.group.specs }}"
        # A wedged runner never reports a step timeout, so the run is killed from
        # inside after 13 minutes, with what macOS says about capture access.
        run: |
          set -m
          e2e/run.sh &
          run_pid=$!
          (
            sleep 780
            echo "::error::watchdog: the call specs did not finish in 13 minutes"
            ps -axo pid,pcpu,pmem,etime,command | sort -k2 -nr | head -15
            log show --last 5m --predicate 'subsystem == "com.apple.TCC"' 2>&1 | tail -40
            kill -TERM -- "-$run_pid"; sleep 10; kill -KILL -- "-$run_pid"
          ) &
          watchdog_pid=$!
          status=0
          wait "$run_pid" || status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          exit "$status"

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-webkit-macos-${{ matrix.group.name }}
          path: |
            e2e/test-results/
            e2e/server.log
          if-no-files-found: ignore
          retention-days: 7
