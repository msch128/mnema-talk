name: Shared desktop client DEV builds

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      acceptance_release:
        description: 'Optional existing release tag to test instead of building'
        required: false
        type: string
      acceptance_instance:
        description: 'Public HTTPS origin for unauthenticated release acceptance'
        required: false
        type: string
      acceptance_fixture:
        description: 'Use an isolated local normal-backend fixture for login/chat/logout'
        required: false
        default: false
        type: boolean
      acceptance_voice:
        description: 'Extend the owned fixture with SFU microphone RTP and voice controls (synthetic input)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, 'codex/**']
    paths:
      - web/**
      - desktop/experimental/**
      - desktop/icons/**
      - .github/workflows/desktop-client.yml

permissions:
  contents: read

concurrency:
  group: shared-desktop-${{ inputs.acceptance_release && format('{0}-{1}', inputs.acceptance_release, github.sha) || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.source.outputs.sha }}
    env:
      RUST_VERSION: 1.99.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/experimental/app/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Capture actual source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.acceptance_fixture
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.acceptance_fixture
        with:
          node-version: 26
      - name: Build released canonical web assets for the normal backend fixture
        if: inputs.acceptance_fixture
        working-directory: web
        shell: powershell
        env:
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACCEPTANCE_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'An existing release tag is required' }
          $env:MNEMA_VERSION = $env:ACCEPTANCE_RELEASE.Substring(1)
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web dependencies failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Fixture web build failed' }
      - name: Test the published Windows release against an actual instance
        timeout-minutes: 15
        # This dispatch-only setup uses the unchanged released web/backend tree.
        # Generated credentials, certificates and database files stay in runner.temp.
        if: inputs.acceptance_release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RELEASE: ${{ inputs.acceptance_release }}
          ACCEPTANCE_INSTANCE: ${{ inputs.acceptance_instance }}
          ACCEPTANCE_FIXTURE: ${{ inputs.acceptance_fixture }}
          ACCEPTANCE_VOICE: ${{ inputs.acceptance_voice }}
        run: |
          if ($env:ACCEPTANCE_VOICE -eq 'true' -and $env:ACCEPTANCE_FIXTURE -ne 'true') { throw 'Voice acceptance requires the owned fixture' }
          if ($env:ACCEPTANCE_FIXTURE -eq 'true') {
            desktop/scripts/test-windows-auth-fixture.ps1 -Tag $env:ACCEPTANCE_RELEASE -VoiceAcceptance:($env:ACCEPTANCE_VOICE -eq 'true')
          } else {
            desktop/scripts/test-windows-release.ps1 -Tag $env:ACCEPTANCE_RELEASE -InstanceUrl $env:ACCEPTANCE_INSTANCE
          }
      - name: Upload bounded Windows acceptance result
        if: inputs.acceptance_release != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-published-release-acceptance
          path: |
            ${{ runner.temp }}/windows-release-acceptance/ACCEPTANCE.json
            ${{ runner.temp }}/windows-release-acceptance/SERVER-RESULT.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.acceptance_release == ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select pinned Rust toolchain
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Check and build the canonical Vue client
        if: inputs.acceptance_release == ''
        working-directory: web
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Web dependencies failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Web lint failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Web typecheck failed' }
          npm run test -- --run
          if ($LASTEXITCODE -ne 0) { throw 'Web tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
      - name: Check and link the canonical protected native host on Windows
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          node desktop/scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path desktop/experimental/crates/crypto-owner/qualified-sdk/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Protected SDK tests failed' }
          cargo test --locked --manifest-path desktop/experimental/crates/crypto-owner/Cargo.toml --features opaque-relay
          if ($LASTEXITCODE -ne 0) { throw 'Protected chat-owner tests failed' }
          cargo build --locked --release --manifest-path desktop/experimental/app/Cargo.toml --features shell,native-crypto,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Protected native host link failed' }
      - name: Check and link the actual shared-client Tauri host
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          node desktop/scripts/checked-glib.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed dependency source verification failed' }
          cargo test --locked --manifest-path desktop/experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared host tests failed' }
          cargo clippy --locked --manifest-path desktop/experimental/app/Cargo.toml --features shell,web-client,custom-protocol --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared host Clippy failed' }
          cargo build --locked --release --manifest-path desktop/experimental/app/Cargo.toml --features shell,web-client,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows executable build failed' }
          if (!(Test-Path 'desktop/experimental/app/target/release/mnema-native-client-preview.exe')) { throw 'Shared executable missing' }
          'Unsigned DEV web-client host linked from desktop/experimental/app with embedded web/dist. This job does not qualify GUI, multi-device E2EE, voice, games, fullscreen overlays or distribution licenses. No automatic update is configured.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Prepare unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devOutput = Join-Path $env:RUNNER_TEMP 'mnema-desktop-windows-dev'
          New-Item -ItemType Directory -Path $devOutput -Force | Out-Null
          $devExe = Join-Path $devOutput 'Mnema Desktop DEV.exe'
          Copy-Item 'desktop/experimental/app/target/release/mnema-native-client-preview.exe' $devExe
          $process = Start-Process -FilePath $devExe -PassThru
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited before opening its window: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'Mnema Desktop DEV — Instance') { $windowReady = $true; break }
            }
            if (!$windowReady) { throw 'Desktop selector window did not appear' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Copy-Item 'desktop/experimental/licenses'  (Join-Path $devOutput 'licenses') -Recurse
          Copy-Item 'LICENSE' $devOutput
          Copy-Item 'THIRD_PARTY_NOTICES.md' $devOutput
          Copy-Item 'desktop/experimental/THIRD_PARTY_NOTICES.md' (Join-Path $devOutput 'NATIVE_THIRD_PARTY_NOTICES.md')
          Copy-Item 'desktop/experimental/README.md' (Join-Path $devOutput 'SOURCE_STATUS.md')
          $devReceipt = [ordered]@{
            kind = 'unsigned-development-web-desktop-client'
            revision = '${{ steps.source.outputs.sha }}'
            target = 'x86_64-pc-windows-msvc'
            executable = 'Mnema Desktop DEV.exe'
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $devExe).Hash.ToLowerInvariant()
            shared_frontend = 'web/src'
            instance_transport = 'same-origin-browser'
            windows_startup_checked = $true
            synthetic_fixture_features = $false
            windows_gui_qualified = $false
            multi_device_e2ee_qualified = $false
            restored_history_qualified = $false
            native_voice_qualified = $false
            real_games_qualified = $false
            distribution_license_closure_complete = $false
            signed = $false
            automatic_updater_package = $false
          }
          $devReceipt | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $devOutput 'DEV-BUILD.json')
          @'
          Mnema Desktop DEV — unsigned development build

          This is the canonical Mnema Vue client embedded in the experimental Tauri host.
          Enter the HTTPS address of a compatible normal Mnema instance. The full
          web app runs at that origin using its existing browser APIs and cookies.

          Windows GUI, multi-device E2EE, restored history, native voice and game
          overlays have not been fully qualified. Voice, camera and screen sharing
          use the WebView browser APIs and still need device testing. No automatic update mechanism is configured.

          Check DEV-BUILD.json for the source revision and executable SHA-256.
          Source and dependency notices accompany this build. The existing prebuilt
          DeepFilterNet WASM still has an incomplete transitive provenance inventory;
          this build does not claim final distribution-license qualification.
          '@ | Set-Content -Encoding utf8 (Join-Path $devOutput 'README-DEV.txt')
      - name: Upload explicitly unsigned Windows DEV artifact
        if: inputs.acceptance_release == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/mnema-desktop-windows-dev/
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    if: inputs.tag != ''
    needs: windows-client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      REVISION: ${{ needs.windows-client.outputs.revision }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mnema-desktop-windows-DEV-UNSIGNED-${{ needs.windows-client.outputs.revision }}
          path: windows
      - name: Verify and publish the unsigned Windows client
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$REVISION"
          jq -e --arg revision "$REVISION" '.revision==$revision and .kind=="unsigned-development-web-desktop-client" and .signed==false and .windows_startup_checked==true and .instance_transport=="same-origin-browser"' windows/DEV-BUILD.json
          test "$(sha256sum 'windows/Mnema Desktop DEV.exe' | cut -d' ' -f1)" = "$(jq -r .executable_sha256 windows/DEV-BUILD.json)"
          name="Mnema-Desktop-DEV-${TAG}-windows-x64.zip"
          (cd windows && zip -qr "../$name" .)
          sha256sum "$name" > WINDOWS-DESKTOP-SHA256SUMS
          gh release upload "$TAG" "$name" WINDOWS-DESKTOP-SHA256SUMS --repo "$GITHUB_REPOSITORY"
