name: Release

# Continuous delivery for main.
#
# Triggered by `workflow_run` when the CI workflow finishes, so nothing here
# runs unless CI passed for that exact push to main. This keeps ci.yml
# unchanged and avoids running the whole CI suite twice (a reusable-workflow
# call would duplicate it on every push). The image is built from the new
# release tag, i.e. the merge commit of the release PR that CI just tested.
#
# Note: release PRs opened with GITHUB_TOKEN start no workflows, but main's
# ruleset requires a pull request with the CI and CodeQL checks. This job
# therefore reports the result of the CI run it was triggered by as commit
# statuses on the release commit (after checking that the PR only touches
# version.txt, CHANGELOG.md and the manifest and sits directly on the tested
# commit) and then merges it. The statuses are not a fixed list: for every
# check that main's ruleset requires, the conclusion of that check on the
# tested commit is mirrored (scripts/release-checks.py), and the PR is not
# merged if one of them did not succeed.
#
# 1. release-please opens/updates a release PR from conventional commits.
#    Every green push to main is released: the job merges that release PR
#    right away and runs release-please a second time, which creates the
#    GitHub Release + tag vX.Y.Z. (A merge made with GITHUB_TOKEN triggers
#    no new workflow run, so the release has to happen in this same job.)
#    The release commit only changes version.txt and CHANGELOG.md.
# 2. The server ships only as a Docker image for linux/amd64 and linux/arm64,
#    cross-compiled without QEMU and pushed to GHCR as
#    :X.Y.Z, :X.Y and :latest, with OCI labels plus BuildKit provenance and
#    SBOM attestations attached to the image. The same image is then copied
#    by digest to Docker Hub (job dockerhub-mirror) when it is configured.
#    The desktop app (Windows, macOS Apple silicon, Linux) lives in
#    msch128/mnema-talk-desktop.
#    Releases through v0.7.3 keep the ZIP that was attached here.
#
# Before a release is cut or merged, the most recent completed scheduled run
# on main of each deep nightly sweep (the list is GATED in
# scripts/nightly-gate.py: sim-sweep, visibility-sweep, store-trace,
# plain-sweep) must have succeeded within the last 48 hours, in its first
# attempt, with no run deleted after it. The one way past a red, re-run, stale
# or missing night is a manual run of this workflow on main with
# `nightly_override` set to the reason (an urgent security fix only,
# doc/development.md "Releases"); it releases main's tip only when CI passed
# for it, and the reason and the actor go into the job summary and into the
# notes of the release it cuts.
#
# Deploying to the self-hosted server stays manual/pull-based (see README).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Two manual uses, one input each (setting both fails the run):
  # - mirror_version, a backfill: mirror an existing release to Docker Hub.
  #   Only the dockerhub-mirror job runs.
  # - nightly_override, the documented override of the nightly gate: release
  #   main's tip although a nightly sweep is red, stale or missing.
  workflow_dispatch:
    inputs:
      mirror_version:
        description: Released version to mirror to Docker Hub, for example 2.0.0 (leave empty for an override)
        required: false
        type: string
      nightly_override:
        description: "Urgent security fix only: why main's tip must be released despite a red, stale or missing nightly sweep (printed in the job summary)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.nightly_override != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
      actions: read # the nightly sweeps' runs and, for an override, CI's run
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      version: ${{ steps.release.outputs.version || steps.publish.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      override_note: ${{ steps.gate.outputs.override_note }}
    steps:
      # CI runs for pushes to main are never cancelled (ci.yml), so an older
      # push can finish green after a newer one landed. release-please always
      # works on main's tip, so only the run for the tip may release; the run
      # for the newer push decides about it. An override (dispatch) has no
      # CI run behind it: it takes main's tip and the successful CI push run
      # for exactly that commit, or stops.
      - name: Check that CI tested main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TESTED=$tip
            RUN_URL=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$tip&per_page=1" \
              --jq '.workflow_runs[0].html_url // empty')
            if [ -z "$RUN_URL" ]; then
              echo "::error::CI has not passed for main's tip $tip; the override releases only a tested commit"
              exit 1
            fi
          fi
          echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$TESTED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI tested $TESTED but main is at $tip; the run for the newer commit releases."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # The scripts that decide come from the tested commit itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.tip.outputs.sha }}
          sparse-checkout: |
            scripts/nightly-gate.py
            scripts/release-checks.py

      # A red night must not ship: before release-please can cut a release
      # (or the PR below is merged), the last completed scheduled run on main
      # of every deep nightly sweep must have succeeded within 48 hours. A run
      # still in progress is no verdict yet, so the completed one before it
      # decides; a sweep that has not had its first night yet (added under 48
      # hours ago) does not block either. Stale, disabled or never-run sweeps
      # block like red ones, so a nightly that stopped cannot look green. The
      # runs of every event are read so that a gap in the run numbers (a
      # deleted run) shows, and the first attempt of a re-run is read so that
      # re-running a red night until it is green does not pass.
      - name: Check the nightly sweeps
        id: gate
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.nightly_override }}
          MIRROR: ${{ inputs.mirror_version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ] && [ -n "$MIRROR" ]; then
            echo "::error::set either mirror_version or nightly_override, not both"
            exit 1
          fi
          work=$(mktemp -d)
          for wf in $(python3 scripts/nightly-gate.py --list); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" > "$work/$wf.workflow.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" > "$work/$wf.runs.json"
            reruns=$(jq -r '.workflow_runs[] | select(.event == "schedule" and .head_branch == "main" and .status == "completed" and .run_attempt > 1) | .id' "$work/$wf.runs.json")
            for id in $reruns; do
              # A first attempt that cannot be read is left out: the gate then blocks and says so.
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/1" > "$work/$wf.attempt1-$id.json" || rm -f "$work/$wf.attempt1-$id.json"
            done
          done
          python3 scripts/nightly-gate.py --override "$OVERRIDE" --summary "$GITHUB_STEP_SUMMARY" \
            --note-file "$work/override-note.txt" "$work"
          # One line without newlines (the script folds the reason's whitespace).
          if [ -s "$work/override-note.txt" ]; then
            echo "override_note=$(cat "$work/override-note.txt")" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.tip.outputs.current == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # Release every green main: merge the release PR that was just
      # opened or updated ...
      - name: Merge release PR
        id: merge
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Read in the script: fromJSON on an empty output breaks the whole
          # job when the tip guard skipped release-please.
          PR_JSON: ${{ steps.release.outputs.pr }}
          TESTED: ${{ steps.tip.outputs.sha }}
          RUN_URL: ${{ steps.tip.outputs.run_url }}
        # Only ever merge release-please's own PR, opened by the Actions bot on
        # its branch and touching nothing but the version and changelog.
        # GitHub may still be computing mergeability right after the update.
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r .number <<<"$PR_JSON")
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,author,files,isCrossRepository,title)
          head=$(jq -r .headRefName <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          cross=$(jq -r .isCrossRepository <<<"$pr")
          files=$(jq -r '.files[].path' <<<"$pr" | sort | tr '\n' ' ')
          echo "PR #$PR_NUMBER head=$head author=$author files=$files"
          case "$head" in release-please--*) ;; *) echo "::error::not a release-please branch"; exit 1 ;; esac
          case "$author" in app/github-actions|github-actions\[bot\]|github-actions) ;; *) echo "::error::unexpected author $author"; exit 1 ;; esac
          [ "$cross" = "false" ] || { echo "::error::cross-repository PR"; exit 1; }
          for f in $files; do
            case "$f" in version.txt|CHANGELOG.md|.release-please-manifest.json) ;; *) echo "::error::unexpected file $f"; exit 1 ;; esac
          done
          # release-please finds the last release by its tag commit in main's
          # history. If main was rewritten (force push) that commit is gone and
          # it proposes an already released version again, with the whole
          # history as changelog. Stop here instead of merging that.
          version=$(jq -r .title <<<"$pr" | sed -nE 's/^chore\(main\): release ([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p')
          [ -n "$version" ] || { echo "::error::cannot read the version from the PR title"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$version already exists; release-please lost the last release (was main rewritten?)"
            exit 1
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$latest" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...main" --jq .status)
            case "$status" in ahead|identical) ;; *)
              echo "::error::$latest is not in main's history (compare: $status); main was rewritten after that release"
              exit 1 ;;
            esac
          fi
          # Main may have moved while release-please ran; merging now would
          # release a commit CI hasn't passed yet.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$TESTED" ]; then
            echo "::notice::main moved to $tip; leaving the release to the CI run for that commit"
            exit 0
          fi
          # main's ruleset requires the CI and CodeQL checks on every pull
          # request, but a PR opened with GITHUB_TOKEN starts no workflows.
          # The release commit sits directly on the commit CI just passed and
          # only touches the files checked above, so report that run's result
          # for it.
          sha=$(jq -r .headRefOid <<<"$pr")
          parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents | map(.sha) | join(" ")')
          if [ "$parent" != "$TESTED" ]; then
            echo "::notice::release PR is based on $parent, not $TESTED; leaving it for the next CI run"
            exit 0
          fi
          # Mirror what main's ruleset requires, not a list kept here: read the
          # required contexts from the ruleset and the conclusions from the
          # check runs of the tested commit. A context that did not succeed
          # there is never reported, and the PR is not merged. CodeQL may
          # still be running when CI completes, so wait for pending ones for up
          # to 30 minutes (60 x 30 s); after that the job fails closed.
          work=$(mktemp -d)
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$work/rules.json"
          decided=1
          for _ in $(seq 1 60); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$TESTED/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion}' > "$work/runs.jsonl"
            set +e
            python3 scripts/release-checks.py "$work/rules.json" "$work/runs.jsonl" > "$work/decision.tsv"
            decided=$?
            set -e
            [ "$decided" -eq 3 ] || break
            sleep 30
          done
          cat "$work/decision.tsv"
          if [ "$decided" -ne 0 ]; then
            echo "::error::required checks did not all succeed on ${TESTED:0:7}; not merging the release PR"
            exit 1
          fi
          while IFS=$'\t' read -r check state; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="$check" \
              -f description="version and changelog only; mirrored from ${TESTED:0:7}" \
              -f target_url="$RUN_URL" >/dev/null
          done < "$work/decision.tsv"
          for _ in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$sha"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      # ... and publish it (tag + GitHub Release) in the same run.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: publish
        if: steps.merge.outputs.merged == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature (Sigstore), this job only
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/msch128/mnema-talk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Source revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mnema Talk
            org.opencontainers.image.description=Lightweight single-server chat with voice and screenshare
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          # Keep in sync with ci.yml's docker job. linux/arm/v7 is left out:
          # the server doesn't compile for 32-bit targets yet (see README).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
          provenance: mode=max
          sbom: true
          # Shares the scope with ci.yml's docker job: the web stage and the
          # module download come from the CI build of this commit on main.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Signs the digest that was just pushed (all tags point at it) with the
      # workflow's OIDC identity; verification is in doc/operations.md.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # The repository moves to the GitHub organization mnema-xyz, and GHCR does
  # not redirect: from this release on the image is also published at
  # ghcr.io/mnema-xyz/mnema-talk, which the defaults and docs name. A copy by
  # digest (the index with its provenance and SBOM attestations, the same four
  # tags as on Docker Hub), signed there with this workflow's identity and
  # verified at both paths, so a release whose new path is incomplete fails.
  # A workflow of a user-owned repository cannot write an organization's
  # package with GITHUB_TOKEN: GHCR_MNEMA_XYZ_TOKEN is a classic PAT of the
  # owner with write:packages only. After the transfer the image job pushes to
  # the new path itself and this job goes.
  org-ghcr:
    # After release-notes as well: both edit the release body, never at once.
    needs: [release-please, image, release-notes]
    if: >-
      !cancelled() && needs.release-please.outputs.release_created == 'true' &&
      needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release note about the new path, once it exists
      id-token: write # keyless cosign signature (Sigstore)
    env:
      SOURCE: ghcr.io/msch128/mnema-talk
      TARGET: ghcr.io/mnema-xyz/mnema-talk
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-please.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR with the organization token
        env:
          TOKEN: ${{ secrets.GHCR_MNEMA_XYZ_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::GHCR_MNEMA_XYZ_TOKEN is not set: the image would not reach ghcr.io/mnema-xyz"; exit 1; }
          # cosign and buildx read the same Docker credentials.
          printf '%s' "$TOKEN" | docker login ghcr.io -u msch128 --password-stdin

      - name: Verify the source, copy by digest, sign and verify the copy
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest from the image job"; exit 1 ;; esac
          identity='^https://github\.com/msch128/mnema-talk/\.github/workflows/release\.yml@refs/heads/main$'
          cosign verify "$SOURCE@$DIGEST" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" >/dev/null
          tags="$VERSION ${VERSION%.*} ${VERSION%%.*} latest"
          args=()
          for tag in $tags; do args+=(--tag "$TARGET:$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE@$DIGEST"
          for tag in $tags; do
            got=$(docker buildx imagetools inspect "$TARGET:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::$TARGET:$tag has digest $got, expected $DIGEST"; exit 1; }
          done
          cosign sign --yes "$TARGET@$DIGEST"
          for _ in 1 2 3 4 5 6; do
            if cosign verify "$TARGET@$DIGEST" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$identity" >/dev/null; then
              echo "Copied and signed $SOURCE@$DIGEST at $TARGET (tags: $tags)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the signature at $TARGET could not be verified"
          exit 1

      # Only once the image is complete at the new path does the release say so.
      - name: Note the new image path in the release
        run: |
          set -euo pipefail
          marker='<!-- image-moved -->'
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$body" in *"$marker"*) echo "note already present"; exit 0 ;; esac
          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '%s\n' "**The image moved to \`ghcr.io/mnema-xyz/mnema-talk\`** (GHCR does not redirect). From this release on, new releases reach GHCR only at the new path: set \`MNEMA_IMAGE\` in \`.env\` to it with the same tag and run \`docker compose pull && docker compose up -d\` once."
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # Copies the image that the image job pushed to Docker Hub, by digest: no
  # rebuild, so the multi-arch index with its provenance and SBOM attestations
  # is byte-identical and keeps the GHCR digest. The Docker Hub reference is
  # signed with this workflow's keyless identity, like the GHCR one.
  # Configuration (none of it is in the repository): repository variable
  # DOCKERHUB_NAMESPACE and secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
  # Without them the job only prints a notice and succeeds, so a missing
  # mirror never fails a release. Once configured, a digest mismatch fails it.
  dockerhub-mirror:
    needs: [release-please, image]
    # After a release (also one from an override): the image job built and
    # signed it. On a backfill dispatch (main only): the version named in the
    # input, which is verified below.
    # !cancelled() lets the job run when release-please and image were skipped.
    if: >-
      !cancelled() && (
        (needs.release-please.outputs.release_created == 'true' &&
          needs.image.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          inputs.mirror_version != '' && inputs.nightly_override == '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two Docker Hub copies: the original one (namespace from the variable
    # DOCKERHUB_NAMESPACE, secrets DOCKERHUB_USERNAME/TOKEN) and the
    # organization's account mnemaxyz (Docker Hub allows no hyphen; secrets
    # DOCKERHUB_MNEMAXYZ_USERNAME/TOKEN). A leg without its secrets is skipped.
    strategy:
      fail-fast: false
      matrix:
        include:
          - namespace: ''
            user_secret: DOCKERHUB_USERNAME
            token_secret: DOCKERHUB_TOKEN
          - namespace: mnemaxyz
            user_secret: DOCKERHUB_MNEMAXYZ_USERNAME
            token_secret: DOCKERHUB_MNEMAXYZ_TOKEN
    permissions:
      contents: read # gh release view, dispatch only; the description source
      packages: read # pull from GHCR
      id-token: write # keyless cosign signature (Sigstore)
    env:
      SOURCE: ghcr.io/msch128/mnema-talk
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_version || needs.release-please.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      NAMESPACE: ${{ matrix.namespace || vars.DOCKERHUB_NAMESPACE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Is the Docker Hub mirror configured?
        id: cfg
        env:
          DH_USER: ${{ secrets[matrix.user_secret] }}
          DH_TOKEN: ${{ secrets[matrix.token_secret] }}
          USER_SECRET: ${{ matrix.user_secret }}
          TOKEN_SECRET: ${{ matrix.token_secret }}
        run: |
          set -eu
          if [ -z "$NAMESPACE" ] || [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::notice::the namespace, $USER_SECRET or $TOKEN_SECRET is not set; this Docker Hub mirror is skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$NAMESPACE" in
            *[!a-z0-9_-]*) echo "::error::DOCKERHUB_NAMESPACE must be a lowercase Docker Hub namespace"; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 2.0.0"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.cfg.outputs.enabled == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          username: ${{ secrets[matrix.user_secret] }}
          password: ${{ secrets[matrix.token_secret] }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.cfg.outputs.enabled == 'true'

      # After a release the digest comes from the image job. On dispatch it is
      # resolved from the GHCR tag and only used once cosign shows that this
      # repository's release workflow signed it, so nothing else can be
      # mirrored under our name.
      - name: Resolve and verify the source image
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            digest=$(docker buildx imagetools inspect "$SOURCE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          else
            digest=$IMAGE_DIGEST
          fi
          case "$digest" in
            sha256:*) ;; *) echo "::error::no digest for $SOURCE:$VERSION"; exit 1 ;;
          esac
          cosign verify "$SOURCE@$digest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/msch128/mnema-talk/\.github/workflows/release\.yml@' >/dev/null
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      # A release gets all four tags. A backfill moves latest and the
      # major/minor aliases only when it is the newest release; an older
      # version gets just its own tag.
      - name: Decide the tags
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tags=$VERSION
          newest=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] || newest=false
          fi
          if [ "$newest" = true ]; then
            tags="$tags ${VERSION%.*} ${VERSION%%.*} latest"
          else
            echo "::notice::$VERSION is older than $latest; only the exact tag is mirrored."
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"

      - name: Copy the image by digest
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          target="docker.io/$NAMESPACE/mnema-talk"
          args=()
          for tag in $TAGS; do args+=(--tag "$target:$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE@$DIGEST"
          for tag in $TAGS; do
            got=$(docker buildx imagetools inspect "$target:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$target:$tag has digest $got, expected $DIGEST"
              exit 1
            fi
          done
          echo "Mirrored $SOURCE@$DIGEST to $target (tags: $TAGS)" >> "$GITHUB_STEP_SUMMARY"

      # Same keyless identity as the GHCR signature (this workflow, on main),
      # so the one documented `cosign verify` command works for both
      # registries, also for a backfill.
      - name: Sign the Docker Hub image and check it
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ref="docker.io/$NAMESPACE/mnema-talk@$DIGEST"
          cosign sign --yes "$ref"
          # Docker Hub can take a moment before a fresh signature is readable.
          for _ in 1 2 3 4 5 6; do
            if cosign verify "$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/msch128/mnema-talk/\.github/workflows/release\.yml@' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::the Docker Hub signature could not be verified"
          exit 1

      # The repository page of the organization's Docker Hub copy (mnemaxyz
      # only; the msch128 copy keeps its page as it is): short and full description from
      # deploy/dockerhub/ of this run's commit on main, so a backfill of an
      # old version also gets the current text (the full one is a Docker Hub
      # specific overview; the repository README is too long for it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.enabled == 'true' && matrix.namespace == 'mnemaxyz'
        with:
          persist-credentials: false
          sparse-checkout: deploy/dockerhub

      - name: Read the short description
        if: steps.cfg.outputs.enabled == 'true' && matrix.namespace == 'mnemaxyz'
        id: short
        run: |
          set -euo pipefail
          text=$(tr -d '\n' < deploy/dockerhub/short-description.txt)
          [ "${#text}" -le 100 ] || { echo "::error::the Docker Hub short description is longer than 100 characters"; exit 1; }
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: steps.cfg.outputs.enabled == 'true' && matrix.namespace == 'mnemaxyz'
        with:
          username: ${{ secrets[matrix.user_secret] }}
          password: ${{ secrets[matrix.token_secret] }}
          repository: ${{ env.NAMESPACE }}/mnema-talk
          short-description: ${{ steps.short.outputs.text }}
          readme-filepath: deploy/dockerhub/README.md
          enable-url-completion: true

  # The desktop client runs a signed bundle of the web app instead of the
  # server's JavaScript (doc/desktop-trusted-client.md). One job builds and
  # signs, in the protected environment, so the signed bytes never come from
  # an unprivileged job or from an artifact handed over between jobs:
  #   - web/dist is built here from the release tag by `npm ci --ignore-scripts`
  #     and `npm run build`, each inside a throwaway container (the same
  #     digest-pinned node image as the Dockerfile's web stage) that gets no
  #     secret, no Docker socket, no host mount except a copy of web/, and for
  #     the build itself no network. Build-time code from a dependency can only
  #     change files in that copy; it cannot touch this job's environment,
  #     PATH, outputs or the signing step.
  #   - The key reaches the single `webbundle build` step only. The tool is
  #     built from the tag's own Go source in an earlier step without the key.
  #   - Without the secret (forks) nothing is built or signed and the job
  #     succeeds.
  # Residual risk (doc/desktop-trusted-client.md): a poisoned dependency that
  # is already in package-lock.json still lands in the build output, because
  # the image build uses the same lockfile. The lockfile pins every package
  # with an integrity hash, Dependabot waits out a cooldown, and the manifest
  # hash is printed for an independent rebuild.
  web-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: web-bundle-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Is a signing key configured?
        id: key
        env:
          KEY: ${{ secrets.WEB_BUNDLE_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WEB_BUNDLE_SIGNING_KEY is not set; the desktop bundle is not built."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # Both containers run as the runner's user with no capabilities, no
      # inherited environment and only the build copy mounted. The install
      # needs the registry; the build runs with the network disabled.
      - name: Build the web app in a sealed container
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          image=$(grep -E '^FROM .* AS web$' Dockerfile | tr ' ' '\n' | grep '^node:')
          case "$image" in node:*@sha256:*) ;; *) echo "::error::cannot find the pinned node image in the Dockerfile"; exit 1 ;; esac
          work="$RUNNER_TEMP/web-build"
          mkdir -p "$work"
          cp -a web "$work/web"
          cp version.txt "$work/version.txt"
          rm -rf "$work/web/dist" "$work/web/node_modules"
          sandbox=(--rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges
            --env HOME=/tmp --mount "type=bind,src=$work,dst=/work" --workdir /work/web)
          docker run "${sandbox[@]}" "$image" npm ci --ignore-scripts --no-audit --no-fund
          docker run "${sandbox[@]}" --network none --env "MNEMA_VERSION=$VERSION" "$image" npm run build
          test -s "$work/web/dist/index.html"
          echo "WEB_DIST=$work/web/dist" >> "$GITHUB_ENV"

      # Built from the tag's Go source here, never from the artifact, and
      # without the signing key in the environment.
      - name: Build the bundle tool
        if: steps.key.outputs.present == 'true'
        run: go build -o "$RUNNER_TEMP/webbundle" ./cmd/webbundle

      # A release that contains a security fix raises the floor to itself, so
      # desktop clients stop running every older bundle, and every later
      # release repeats the highest floor raised so far. A fix says so with an
      # explicit `Security-Floor: raise` trailer in its commit message
      # (scripts/security-floor.sh; the commit subject plays no part).
      - name: Decide the security floor
        if: steps.key.outputs.present == 'true'
        id: floor
        run: |
          set -euo pipefail
          floor=$(sh scripts/security-floor.sh "$TAG" "$VERSION")
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "Security floor: ${floor:-never raised (web/desktop-compat.json applies)} (highest raise up to $TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the bundle
        if: steps.key.outputs.present == 'true'
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          WEB_BUNDLE_SIGNING_KEY: ${{ secrets.WEB_BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/webbundle" build -dir "$WEB_DIST" -compat web/desktop-compat.json \
            -version "$VERSION" -commit "$(git rev-parse HEAD)" -security-floor "$FLOOR" -out bundle

      - name: Verify the bundle
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/webbundle" verify -zip "bundle/mnema-web-$VERSION.zip" -pub web/desktop-signing.pub
          # Belt and braces next to the tool's own rules: nothing hidden and no
          # server-only API reference may sit in the signed archive.
          if unzip -Z1 "bundle/mnema-web-$VERSION.zip" | grep -E '(^|/)\.|api-docs|apiDocs'; then
            echo "::error::the signed bundle contains a hidden file or the API reference"
            exit 1
          fi
          {
            echo "### Desktop bundle $VERSION"
            echo
            echo "manifest sha256: \`$(sha256sum bundle/manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the bundle to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "bundle/mnema-web-$VERSION.zip" bundle/manifest.json bundle/manifest.sig \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The TypeScript bot SDK (sdk/typescript) as an npm tarball attached to the
  # release, with its SHA-256 next to it: `npm install <asset URL>` (doc/bots.md,
  # SDKs). Built from the tag in a sealed container like the web bundle (the
  # install needs the registry, the build and pack run with the network
  # disabled), with the release's version stamped in at pack time: the release
  # commit itself only ever touches version.txt, CHANGELOG.md and the manifest.
  sdk-package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Pack the SDK in a sealed container
        run: |
          set -euo pipefail
          image=$(grep -E '^FROM .* AS web$' Dockerfile | tr ' ' '\n' | grep '^node:')
          case "$image" in node:*@sha256:*) ;; *) echo "::error::cannot find the pinned node image in the Dockerfile"; exit 1 ;; esac
          work="$RUNNER_TEMP/sdk-build"
          mkdir -p "$work"
          cp -a sdk/typescript "$work/sdk"
          rm -rf "$work/sdk/dist" "$work/sdk/node_modules"
          version_ts="$work/sdk/src/version.ts"
          grep -qx "export const VERSION = '0.0.0-dev'" "$version_ts" || { echo "::error::sdk/typescript/src/version.ts does not hold the dev placeholder"; exit 1; }
          sed -i "s/^export const VERSION = '0.0.0-dev'\$/export const VERSION = '$VERSION'/" "$version_ts"
          grep -qx "export const VERSION = '$VERSION'" "$version_ts"
          sandbox=(--rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges
            --env HOME=/tmp --mount "type=bind,src=$work,dst=/work" --workdir /work/sdk)
          docker run "${sandbox[@]}" "$image" npm ci --ignore-scripts --no-audit --no-fund
          docker run "${sandbox[@]}" --network none "$image" npm version --no-git-tag-version --allow-same-version "$VERSION"
          # A git install builds through `prepare`; the tarball ships dist/, so
          # it carries no install script that npm would ask a consumer about.
          docker run "${sandbox[@]}" --network none "$image" npm pkg delete scripts.prepare
          docker run "${sandbox[@]}" --network none "$image" npm pack
          tar -xzOf "$work/sdk/mnema-talk-sdk-$VERSION.tgz" package/package.json > "$RUNNER_TEMP/packed-package.json"
          if grep -q '"prepare"' "$RUNNER_TEMP/packed-package.json"; then echo "::error::the packed SDK still has a prepare script"; exit 1; fi
          file="mnema-talk-sdk-$VERSION.tgz"
          test -s "$work/sdk/$file"
          mkdir -p sdk-out
          cp "$work/sdk/$file" sdk-out/
          (cd sdk-out && sha256sum "$file" > "$file.sha256")
          {
            echo "### TypeScript SDK $VERSION"
            echo
            echo "sha256: \`$(cut -d' ' -f1 "sdk-out/$file.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the SDK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "sdk-out/mnema-talk-sdk-$VERSION.tgz" "sdk-out/mnema-talk-sdk-$VERSION.tgz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The server releases carry the Docker image and the signed web bundle, not
  # desktop installers (those come from the desktop repository). Say so in the
  # release body, so nobody looks for a download that is not here. Idempotent:
  # the marker comment keeps a rerun from appending the section twice.
  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Append the desktop app section
        run: |
          set -eu
          marker='<!-- desktop-app-section -->'
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$body" in *"$marker"*) echo "section already present"; exit 0 ;; esac
          # The releases page, not one tag: a tag URL freezes whatever was
          # current when this server release was published.
          url="https://github.com/msch128/mnema-talk-desktop/releases"
          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '%s\n\n' "### Desktop app (Beta)"
            printf '%s\n' "The desktop app (Beta, unsigned) for Windows, macOS and Linux is published in its own repository: [latest desktop release]($url)."
            printf '%s\n' "This server release carries the Docker image (\`ghcr.io/mnema-xyz/mnema-talk:$VERSION\`) and the signed web bundle that the desktop app verifies, not desktop installers."
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      # A release cut by the nightly override keeps its reason and actor in its
      # notes (the run summary expires with the logs). One plain line at the
      # end, written by scripts/nightly-gate.py: the login in code marks and no
      # '@', so nobody is linked or notified.
      - name: Record the nightly override
        if: needs.release-please.outputs.override_note != ''
        env:
          NOTE: ${{ needs.release-please.outputs.override_note }}
        run: |
          set -eu
          marker='<!-- nightly-override -->'
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$body" in *"$marker"*) echo "override line already present"; exit 0 ;; esac
          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '%s\n' "$NOTE"
          } > override-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file override-notes.md
