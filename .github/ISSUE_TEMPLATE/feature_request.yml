name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Mnema Talk is one community per server by design: no direct messages, no federation,
        no text end-to-end encryption. Ideas that keep it small and quiet fit best.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe your situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this
