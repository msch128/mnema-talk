services:
  # ==========================================================
  # Mnema Talk Application (Go + Vue 3 Embedded + Pion SFU)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mnema-talk:local
    container_name: mnema-talk
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
      - "${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}:${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}/udp"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      # Empty = PUBLIC_URL only.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Empty = loopback + private ranges (reverse proxy / Docker bridge).
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS:-720}
      - DATABASE_URL=postgres://${POSTGRES_USER:-mnema}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnema_talk}?sslmode=disable
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mnema-media}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-mnema_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=true
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - LINK_PREVIEWS_ENABLED=${LINK_PREVIEWS_ENABLED:-true}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # 0 = automatic media deletion OFF. Keep it off unless you really want pruning.
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-0}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Herzog}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - WEBRTC_UDP_PORT_MIN=${WEBRTC_UDP_PORT_MIN:-50000}
      - WEBRTC_UDP_PORT_MAX=${WEBRTC_UDP_PORT_MAX:-50050}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS:-}
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:-}
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - LEGAL_OPERATOR_NAME=${LEGAL_OPERATOR_NAME:-Community Operator}
      - LEGAL_OPERATOR_EMAIL=${LEGAL_OPERATOR_EMAIL:-admin@example.com}
      - LEGAL_OPERATOR_COUNTRY=${LEGAL_OPERATOR_COUNTRY:-Deutschland}
      - LEGAL_PROJECT_NOTICE=${LEGAL_PROJECT_NOTICE:-Privates, nicht-kommerzielles Projekt}
    # The app writes nothing to disk except multipart upload temp files.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - mnema-network

  # ==========================================================
  # Database: PostgreSQL 17
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: mnema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mnema_talk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnema} -d ${POSTGRES_DB:-mnema_talk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mnema-network

  # ==========================================================
  # Object Storage: SeaweedFS (S3-compatible)
  # ==========================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: mnema-seaweedfs
    restart: unless-stopped
    command: "server -s3 -s3.port=8333 -dir=/data"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mnema-network

  # ==========================================================
  # Optional TURN Relay: coturn (profile: turn)
  # ==========================================================
  # Enable with: docker compose --profile turn up -d
  # Router port forward required: 3478 UDP/TCP (TCP serves browsers that may
  # not use UDP, e.g. Opera with its VPN or WebRTC protection); 49152-49200 UDP
  # only for relaying to peers outside the LAN.
  coturn:
    image: coturn/coturn:4.18.0-alpine
    container_name: mnema-coturn
    restart: unless-stopped
    profiles:
      - turn
    network_mode: host
    environment:
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - WEBRTC_TURN_REALM=${WEBRTC_TURN_REALM:-turn.example.com}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
    # Refuses to start without a real secret: with an empty static-auth-secret
    # anyone could mint credentials and use the relay.
    # Never relays into private, loopback, link-local or reserved ranges (incl.
    # their IPv4-mapped IPv6 form) nor to the server's own public IP, so the
    # relay cannot reach the NAS LAN, Docker networks or host services. The
    # one exception is the voice server itself: a private IP listed in
    # WEBRTC_NAT_1TO1_IP (its LAN address) is allowed, otherwise relayed
    # clients could never reach it.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#WEBRTC_TURN_SECRET}" -lt 16 ]; then
          echo "WEBRTC_TURN_SECRET must be at least 16 characters" >&2
          exit 1
        fi
        self=""
        for entry in $$(echo "$$WEBRTC_NAT_1TO1_IP" | tr ',' ' '); do
          case "$$entry" in
            10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*)
              # Relay from (and allow) only the voice server's LAN address, never
              # a Docker or VPN interface the voice server cannot reach.
              self="$$self --allowed-peer-ip=$$entry --relay-ip=$$entry" ;;
            *[!0-9.]*) ;; # a host name, e.g. dynamic DNS: nothing to add
            *) self="$$self --denied-peer-ip=$$entry" ;;
          esac
        done
        exec turnserver -n --use-auth-secret \
          --static-auth-secret="$$WEBRTC_TURN_SECRET" --realm="$$WEBRTC_TURN_REALM" \
          --listening-port=3478 --min-port=49152 --max-port=49200 \
          --fingerprint --no-cli --no-multicast-peers --no-tcp-relay \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=240.0.0.0-255.255.255.255 \
          --denied-peer-ip=::-::1 \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255 \
          --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          $$self

volumes:
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local

networks:
  mnema-network:
    name: mnema-network
    driver: bridge
