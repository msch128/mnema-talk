name: CI

on:
  push:
    branches: [main]
  pull_request:
    # release-please's PRs only bump these files and are merged right away by
    # release.yml; CI runs on the resulting push to main instead.
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json

permissions:
  contents: read

# Pull requests: a new push cancels the superseded run. Pushes to main get one
# group per commit and are never cancelled: release.yml runs on the
# `workflow_run` completion of this workflow, and a cancelled run on main would
# neither release nor save the caches that pull requests restore from.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Keep in sync with GOVULNCHECK_VERSION in the Makefile.
  GOVULNCHECK_VERSION: v1.9.0
  TRIVY_VERSION: 0.76.1
  # sha256 of trivy_0.76.1_Linux-64bit.tar.gz from the upstream checksums.txt
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  # -- Secret scan: the whole tree plus the commits this push/PR adds --------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: gitleaks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # -- What changed: docs-only pull requests skip the heavy work -------------
  # Every required check still reports: the jobs below run, skip their steps
  # (a job-level `if` would leave matrix legs such as `upgrade-drill (1.1.0)`
  # unreported and block the merge) and succeed. Only README/SECURITY and doc/
  # Markdown count as docs; no test reads them (the docs links, conflict marker
  # and English-only checks run in every case), so anything else, a workflow
  # file included, is code. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of the pull request and its two parents.
          fetch-depth: 2

      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            # HEAD^1 is the base branch, so this is what the pull request changes.
            changed="$(git diff --name-only HEAD^1 HEAD)"
            echo "$changed"
            if [ -n "$changed" ] && ! grep -qvE '^(doc/.*\.md|[^/]+\.md)$' <<<"$changed"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  # -- Backend: vet, format, unit tests, build; the integration tests with
  # coverage run in parallel shards (backend-integration) and the coverage
  # gates on their merged profiles (backend-coverage). The required check
  # `backend` succeeds only if all three jobs did.
  backend-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mnema
          POSTGRES_PASSWORD: mnema
          POSTGRES_DB: mnema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnema -d mnema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the service container above.
      TEST_DATABASE_URL: postgres://mnema:mnema@localhost:5432/mnema_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags and history: make openapi-diff compares with the latest v* tag
          # and reads the commit messages of the change.
          fetch-depth: 0

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-backend-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-backend-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: gofmt
        run: |
          out="$(gofmt -l cmd internal web/web.go)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"; echo "$out"; exit 1
          fi

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Cognitive complexity
        run: make complexity-check

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: OpenAPI description is up to date
        run: make openapi-check

      # Fails on breaking changes of the REST contract since the latest release
      # tag (doc/api-stability.md); a BREAKING CHANGE: commit footer waives it.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: OpenAPI has no breaking changes
        env:
          OPENAPI_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: make openapi-diff

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Unit tests
        run: go test -race -count=1 ./...

      # Mutation fuzzing of the parsers (search, mentions, durations, URL guard,
      # versions) for 1 s each on top of the seed corpora that `go test` ran.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Fuzz smoke
        run: FUZZTIME=1s make fuzz-smoke

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Backup and restore fault tests
        run: make test-scripts

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/server

      # Relative links and #anchors in README.md, SECURITY.md and doc/*.md; no
      # network access.
      - name: Docs links
        run: node scripts/check-doc-links.mjs

      # Fails on <<<<<<<, ======= or >>>>>>> at the start of a line in any
      # tracked text file (docs, code, JSON).
      - name: Merge-conflict markers
        run: node scripts/check-conflict-markers.mjs

      # Code, comments, docs and fixtures are English only. German lives in the
      # locale resources and in tests that assert it; see
      # scripts/english-only-allowlist.txt.
      - name: English only
        run: |
          node --test scripts/check-english-only.test.mjs
          node scripts/check-english-only.mjs

      # The alert rules operators copy (doc/operations.md). The image is pinned
      # by digest (prom/prometheus v3.15.1); the metrics they name are checked
      # against /api/metrics by TestAlertRulesNameOnlyExportedMetrics above.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring:/rules:ro" \
            prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 \
            check rules /rules/mnema-alerts.yml

  # Unit and integration tests together record which code they reach. The
  # integration tests of a package reset the database they are given, so each
  # shard has a PostgreSQL of its own and runs its packages one after another.
  # The shards are balanced by hand (internal/server alone takes about as long
  # as the other two groups); `rest` is every package not named elsewhere, so a
  # new package is always tested.
  backend-integration:
    name: backend-integration (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [server, realtime, rest]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mnema
          POSTGRES_PASSWORD: mnema
          POSTGRES_DB: mnema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnema -d mnema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the service container above.
      TEST_DATABASE_URL: postgres://mnema:mnema@localhost:5432/mnema_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-backend-integration-${{ matrix.shard }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-backend-integration-${{ matrix.shard }}-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Integration tests (with coverage)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            server) pkgs='./internal/server' ;;
            realtime) pkgs='./internal/bot ./internal/chat' ;;
            rest) pkgs="$(go list ./... | grep -v -E '/internal/(server|bot|chat)$' | tr '\n' ' ')" ;;
          esac
          make coverage-go-profile GO_PKGS="$pkgs" COVERAGE_OUT="coverage-$SHARD.out"

      - name: Upload coverage profile
        if: ${{ !cancelled() && hashFiles('coverage-*.out') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-profile-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 7

  # make coverage-go used to fail below 90 % in total or 80 % in any file; the
  # same gates now apply to the merged profiles (scripts/coverage-summary.mjs
  # keeps the highest count of every block, which is how it already read the
  # profile of one run with several test binaries). The summary and the report
  # are published even when a gate fails.
  backend-coverage:
    needs: [changes, backend-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-go-profile-*
          path: profiles

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Merge the profiles
        run: |
          set -euo pipefail
          echo "mode: atomic" > coverage.out
          for f in profiles/*/coverage-*.out; do tail -n +2 "$f" >> coverage.out; done

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Coverage summary
        run: node scripts/coverage-summary.mjs go coverage.out --min 90 --file-min 80 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

  # The required check: unchanged name, one verdict for the three jobs above.
  backend:
    needs: [backend-checks, backend-integration, backend-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All backend jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # -- Go vulnerability scan (reachable symbols only) ------------------------
  govulncheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-govulncheck-${{ steps.go.outputs.go-version }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-govulncheck-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # -- Frontend: lint, test, build, audit ------------------------------------
  frontend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: npm ci --no-audit --no-fund
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Browser test compiler dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: npm run lint
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Generated frontend contracts are up to date
        run: npm run contracts:check
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Strict TypeScript checks
        run: npm run typecheck
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Strict browser test TypeScript checks
        working-directory: e2e
        run: npm run typecheck
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: npm run test:coverage

      # Require 90% on all four totals and 80% in every module; reviewed
      # per-module exceptions may lower individual thresholds to 60%, never the totals.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: npm run coverage:check >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: |
            web/coverage/lcov.info
            web/coverage/coverage-final.json
            web/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30

      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: npm run build

      # The desktop client runs a signed bundle of this build. Sign it with a
      # throwaway key and verify it, so a change that breaks the bundle (or
      # web/desktop-compat.json) fails here and not in the release workflow.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-frontend-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-frontend-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Desktop bundle round trip
        working-directory: .
        run: scripts/web-bundle-check.sh

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: npm audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high

  # -- Container image (build only, never pushed) ----------------------------
  # Same platforms as the release image, so a Dockerfile change that breaks
  # one of them fails here and not in the release. The Go binary is
  # cross-compiled on the runner (no QEMU), so arm64 adds about one compile.
  # The build runs first and alone, so the drills (docker and upgrade-drill
  # below) start together from its layer cache instead of one after the other.
  docker-image:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: mnema-talk:ci
          # VERSION stays empty: the image reports version.txt, like a local build.
          build-args: |
            REVISION=${{ github.sha }}
          # Same scope as the release image build (release.yml), which then
          # reuses these layers from main.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  # The required check `docker`: smoke test, install, backup, PostgreSQL
  # upgrade and image scan against the amd64 image from that cache.
  docker:
    needs: [changes, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runner's architecture again, from the cache above, into the local
      # Docker daemon for the smoke test and the scan.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mnema-talk:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image

      # The production docker-compose.yml with throwaway secrets: healthcheck,
      # /api/health and an admin login against the real image.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Smoke test (compose stack)
        run: scripts/smoke-image.sh mnema-talk:ci

      # doc/deployment.md "Fresh install" in an empty directory: the compose
      # file and .env.example of this checkout, throwaway secrets, up --wait,
      # health and the Owner's sign-in.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Fresh install (doc/deployment.md)
        run: scripts/fresh-install-check.sh mnema-talk:ci

      # scripts/backup.sh and restore.sh (--verify and --yes) end to end:
      # seeded message and upload come back, later changes are gone.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Backup/restore drill (compose stack)
        run: scripts/backup-drill.sh mnema-talk:ci

      # Mnema Talk 0.4 ran PostgreSQL 17 on another volume: the current
      # compose file must refuse to start on it, and upgrade-postgres.sh
      # must carry the data over.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: PostgreSQL 17 -> 18 upgrade drill
        run: scripts/postgres-upgrade-drill.sh mnema-talk:ci

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Install trivy (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      # Fixable HIGH/CRITICAL vulnerabilities in the OS packages and the Go
      # binary fail the build (and so the release, which waits for CI).
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Scan image
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress mnema-talk:ci

  # -- Upgrade drill: released versions -> this build, with data in between --
  # One parallel leg per supported source version (keep the matrix and
  # DRILL_DEFAULT_FROM_VERSIONS in scripts/drill-common.sh in step). A leg
  # installs that release from GHCR, seeds users, channels, messages, an
  # upload, roles and overwrites, a webhook, a bot, notification levels and
  # (from 0.9.0) onboarding and role mentions through the API, switches the
  # stack to the image built here and checks migrations, row counts, an
  # authenticated read of each object, sessions and health. It then backs up
  # on the old release, restores into this build with scripts/restore.sh and
  # checks that the old release refuses to start on the migrated data.
  # A registry outage is retried a few times and then fails the leg with a
  # clear message; nothing is skipped and the job is not continue-on-error.
  # The required checks are named "upgrade-drill (<version>)", one per leg.
  # Waits for the docker-image job so the image layers come from its build cache.
  upgrade-drill:
    needs: [changes, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        from: ['0.8.16', '0.9.0', '1.0.0', '1.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mnema-talk:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Upgrade drill (${{ matrix.from }} -> this build)
        env:
          FROM_VERSIONS: ${{ matrix.from }}
        run: |
          set -euo pipefail
          scripts/upgrade-drill.sh mnema-talk:ci | tee "$RUNNER_TEMP/upgrade-drill.log"
          echo "- upgrade ${{ matrix.from }}: $(grep -E '^==> upgrade drill passed' "$RUNNER_TEMP/upgrade-drill.log")" >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Restore drill (back up on ${{ matrix.from }}, restore into this build, refuse downgrade)
        env:
          FROM_VERSION: ${{ matrix.from }}
        run: |
          set -euo pipefail
          scripts/backup-drill.sh mnema-talk:ci | tee "$RUNNER_TEMP/backup-drill.log"
          echo "- restore ${{ matrix.from }}: $(grep -E '^==> backup drill passed' "$RUNNER_TEMP/backup-drill.log")" >> "$GITHUB_STEP_SUMMARY"

  # -- Browser smoke test: login, chat message, talk, against the real binary -
  # Four jobs, each with a server, database and Owner of its own: the 85-odd
  # specs used to run one after another on one worker, all as the same account
  # and so on one API rate budget (tests/fixtures.ts paces them). A shard is a
  # fresh stack, so nothing is shared between them and fixtures.ts is untouched.
  # Playwright deals the spec files out evenly (--shard=i/4). The required check
  # `e2e` is the job at the end of this section.
  e2e-chromium:
    name: e2e-shard (${{ matrix.shard }}/4)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # Browsers only; the system packages come from the step below, and
      # e2e/run.sh skips the browser download when the cached revision is present.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' e2e/package-lock.json)" >> "$GITHUB_OUTPUT"

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # System libraries for the browsers, in a bounded step of their own. A slow
      # Ubuntu mirror used to stall `playwright install --with-deps` inside
      # e2e/run.sh until the job timed out. e2e/ci-install-deps.sh bounds each
      # attempt, retries on another mirror, and the downloaded .debs are cached
      # per Playwright version and browser.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright system dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Install browser system dependencies
        timeout-minutes: 10
        run: e2e/ci-install-deps.sh chromium webkit

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Run browser smoke test
        env:
          E2E_INSTALL_BROWSER: "1"
          E2E_BROWSERS: chromium webkit
          E2E_BLOB: "1"
          E2E_ONLY: --project=chromium --project=mobile-chromium --project=mobile-webkit --shard=${{ matrix.shard }}/4
        run: e2e/run.sh

      # The blob report of every shard, merged by e2e-report into one HTML report.
      - name: Upload Playwright blob report
        if: ${{ !cancelled() && hashFiles('e2e/blob-report/*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/server.log
          if-no-files-found: ignore
          retention-days: 7

  # One readable report (failures with traces and screenshots) for all shards.
  e2e-report:
    needs: [changes, e2e-chromium]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: e2e

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7

  # The required check: unchanged name, succeeds only if every shard did.
  e2e:
    needs: [e2e-chromium]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All e2e shards succeeded
        env:
          RESULT: ${{ needs.e2e-chromium.result }}
        run: |
          echo "result: $RESULT"
          [ "$RESULT" = success ]

  # -- Other engines: every spec that does not need a sealed call on WebKit (iOS,
  # Safari, installed PWAs) and a smoke subset on Firefox. Not a required check
  # until both have run stable (see doc/product-status.md).
  e2e-browsers:
    needs: changes
    name: e2e (${{ matrix.browser }}${{ matrix.browser == 'webkit' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
        # WebKit runs in two halves (about 16 minutes as one job); Firefox is
        # short and runs whole, so its second half is dropped.
        shard: ['1/2', '2/2']
        exclude:
          - browser: firefox
            shard: '2/2'
        include:
          # Playwright's Linux WebKit has no RTCRtpScriptTransform (nor
          # createEncodedStreams or RTCEncodedAudioFrame; same 26.6 build as on
          # macOS, which has them), so a call cannot be sealed there and the app
          # refuses to join one. Every spec that joins a call is left out here and
          # runs on macOS WebKit locally (evidence in doc/product-status.md); this
          # list is every other spec, plus browser-sealing.spec.ts for the refusal.
          - browser: webkit
            only: "--project=webkit account-delete.spec.ts active-members.spec.ts audit.spec.ts bot-members.spec.ts bots.spec.ts browser-sealing.spec.ts crypto-state.spec.ts drafts.spec.ts layout.spec.ts mentions.spec.ts message-moderation.spec.ts moderation.spec.ts notifications.spec.ts onboarding.spec.ts polls.spec.ts pwa.spec.ts search.spec.ts sidebar-layout.spec.ts two-factor.spec.ts unread-jump.spec.ts upload-limit.spec.ts webhooks-outgoing.spec.ts webhooks-ui.spec.ts webhooks.spec.ts"
          # The runner has no audio output device, and Firefox then never starts an
          # AudioContext: audio-stall.spec.ts is the real case of a member whose audio
          # engine is dead (told, and still heard). The call specs that need the AI
          # noise filter to run (late-join.spec.ts) follow with an audio device.
          - browser: firefox
            only: "--project=firefox smoke.spec.ts browser-sealing.spec.ts key-lifecycle.spec.ts search.spec.ts mentions.spec.ts screenshare.spec.ts audio-stall.spec.ts"
            withAudioDevice: "--project=firefox late-join.spec.ts"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          # Cached per job below: setup-go's cache key is the same for every
          # job, so whichever job finished first decided what all of them got.
          cache: false

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Go module + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-e2e-${{ steps.go.outputs.go-version }}-

      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # Browsers only; the system packages come from the step below, and
      # e2e/run.sh skips the browser download when the cached revision is present.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' e2e/package-lock.json)" >> "$GITHUB_OUTPUT"

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # System libraries for the browsers, in a bounded step of their own. A slow
      # Ubuntu mirror used to stall `playwright install --with-deps` inside
      # e2e/run.sh until the job timed out. e2e/ci-install-deps.sh bounds each
      # attempt, retries on another mirror, and the downloaded .debs are cached
      # per Playwright version and browser.
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Playwright system dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Install browser system dependencies
        timeout-minutes: 10
        run: e2e/ci-install-deps.sh ${{ matrix.browser }}

      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Run browser smoke test
        env:
          E2E_INSTALL_BROWSER: "1"
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_ONLY: ${{ matrix.only }} ${{ matrix.browser == 'webkit' && format('--shard={0}', matrix.shard) || '' }}
        run: e2e/run.sh

      # The same build, on a runner that has an audio output device.
      - if: ${{ needs.changes.outputs.code == 'true' && matrix.withAudioDevice }}
        name: Audio device
        timeout-minutes: 5
        run: e2e/ci-audio-sink.sh

      - if: ${{ needs.changes.outputs.code == 'true' && matrix.withAudioDevice }}
        name: Run the specs that need the AI noise filter
        env:
          SKIP_BUILD: "1"
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_ONLY: ${{ matrix.withAudioDevice }}
        run: e2e/run.sh

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            e2e/test-results/
            e2e/server.log
          if-no-files-found: ignore
          retention-days: 7
