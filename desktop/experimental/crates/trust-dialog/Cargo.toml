[package]
name="mnema-private-native-trust-dialog"
version="0.0.0"
edition="2024"
publish=false
license="AGPL-3.0-only"
[features]
default=[]
research-fixture=["mnema-private-native-client-broker/synthetic-transport-fixture"]
os-modal=["dep:tauri","dep:objc2","dep:objc2-app-kit","dep:objc2-foundation","dep:block2","dep:windows-sys","dep:gtk"]
[dependencies]
mnema-private-native-client-broker={path="../broker"}
uuid={version="=1.27.0",features=["v4"]}
url="=2.5.8"
base64="=0.22.1"
tokio={version="=1.53.2",features=["sync","time"]}
tauri={version="=2.12.1",optional=true}
[target.'cfg(target_os="macos")'.dependencies]
objc2={version="=0.6.5",optional=true}
objc2-app-kit={version="=0.3.2",optional=true,default-features=false,features=["NSAlert","NSWindow","NSButton","NSApplication","block2"]}
objc2-foundation={version="=0.3.2",optional=true,default-features=false,features=["NSString"]}
block2={version="=0.6.2",optional=true}
[target.'cfg(windows)'.dependencies]
windows-sys={version="=0.61.2",optional=true,features=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Controls"]}
[target.'cfg(target_os="linux")'.dependencies]
gtk={version="=0.18.2",optional=true}

[dev-dependencies]
serde_json="=1.0.151"

# Reviewed GTK3-compatible RUSTSEC-2024-0429 backport; see scripts/checked-glib.mjs.
[patch.crates-io]
glib = { path = "../../vendor/glib" }
