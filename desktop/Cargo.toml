[package]
name = "mnema-desktop-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Windows-first feasibility probe; not a released Mnema client"

[features]
default = []
shell = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls"] }
tauri = { version = "=2.12.1", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }

[[bin]]
name = "mnema-desktop-probe"
path = "src/main.rs"
required-features = ["shell"]
