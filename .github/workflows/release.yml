name: Release

# Continuous delivery for main.
#
# Triggered by `workflow_run` when the CI workflow finishes, so nothing here
# runs unless CI passed for that exact push to main. This keeps ci.yml
# unchanged and avoids running the whole CI suite twice (a reusable-workflow
# call would duplicate it on every push). The image is built from the new
# release tag, i.e. the merge commit of the release PR that CI just tested.
#
# Note: release PRs opened with GITHUB_TOKEN do not trigger CI themselves;
# CI runs on the push to main when the release PR is merged, and only then
# is the release published.
#
# 1. release-please opens/updates a release PR from conventional commits.
#    Every green push to main is released: the job merges that release PR
#    right away and runs release-please a second time, which creates the
#    GitHub Release + tag vX.Y.Z. (A merge made with GITHUB_TOKEN triggers
#    no new workflow run, so the release has to happen in this same job.)
#    The release commit only changes version.txt and CHANGELOG.md.
# 2. When a release was created, compiled binaries (linux amd64/arm64,
#    windows amd64, darwin arm64) plus SHA256SUMS are attached to it, and
#    the image is built and pushed to GHCR as
#    :X.Y.Z, :X.Y and :latest, with OCI labels plus BuildKit provenance and
#    SBOM attestations attached to the image.
#
# Deploying to the self-hosted server stays manual/pull-based (see README).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      version: ${{ steps.release.outputs.version || steps.publish.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # Release every green main: merge the release PR that was just
      # opened or updated ...
      - name: Merge release PR
        id: merge
        if: steps.release.outputs.release_created != 'true' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        # Only ever merge release-please's own PR, opened by the Actions bot on
        # its branch and touching nothing but the version and changelog.
        # GitHub may still be computing mergeability right after the update.
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,author,files,isCrossRepository)
          head=$(jq -r .headRefName <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          cross=$(jq -r .isCrossRepository <<<"$pr")
          files=$(jq -r '.files[].path' <<<"$pr" | sort | tr '\n' ' ')
          echo "PR #$PR_NUMBER head=$head author=$author files=$files"
          case "$head" in release-please--*) ;; *) echo "::error::not a release-please branch"; exit 1 ;; esac
          case "$author" in app/github-actions|github-actions\[bot\]|github-actions) ;; *) echo "::error::unexpected author $author"; exit 1 ;; esac
          [ "$cross" = "false" ] || { echo "::error::cross-repository PR"; exit 1; }
          for f in $files; do
            case "$f" in version.txt|CHANGELOG.md|.release-please-manifest.json) ;; *) echo "::error::unexpected file $f"; exit 1 ;; esac
          done
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch && exit 0
            sleep 10
          done
          exit 1

      # ... and publish it (tag + GitHub Release) in the same run.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: publish
        if: steps.merge.outcome == 'success'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

  # Compiled single binaries (web app embedded) attached to the GitHub Release,
  # with a SHA256SUMS file for verification.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            name="mnema-talk_${VERSION}_${os}_${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-w -s -X main.version=${VERSION}" -o "dist/${name}" ./cmd/server
          done
          (cd dist && sha256sum mnema-talk_* > SHA256SUMS)
          ls -la dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/msch128/mnema-talk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mnema Talk
            org.opencontainers.image.description=Lightweight single-server chat with voice and screenshare
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
