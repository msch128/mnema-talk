[package]
name = "mnema-private-synthetic-media-policy"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default = []
synthetic-media-fixture = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
uuid = { version = "=1.27.0", features = ["v4"] }
zeroize = { version = "=1.9.1", features = ["serde"] }
native-tls = "=0.2.18"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
