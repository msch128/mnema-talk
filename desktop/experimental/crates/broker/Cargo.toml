[package]
name = "mnema-private-native-client-broker"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default=[]
synthetic-transport-fixture=["dep:libc"]
synthetic-media-fixture=["synthetic-transport-fixture","dep:mnema-private-synthetic-media-policy"]

[dependencies]
mnema-private-synthetic-media-policy={path="../media/rust",optional=true,features=["synthetic-media-fixture"]}
mnema-desktop-probe = { path = "../../..", default-features = false }
mnema-private-vault-facade = { path = "research-vault-facade", features = ["native-facade"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
base64 = "=0.22.1"
zeroize = "=1.9.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "=1.27.0", features = ["v4"] }

tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
native-tls = "=0.2.18"

[target.'cfg(unix)'.dependencies]
libc={version="=0.2.190",optional=true}

[[example]]
name="opaque_relay_fixture"
path="examples/opaque_relay_fixture.rs"
required-features=["synthetic-transport-fixture"]
