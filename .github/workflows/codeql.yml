name: CodeQL

# Advanced setup instead of GitHub's default setup: default setup builds Go
# without build tags and skips _test.go files, so tests and the integration-tagged
# files (internal/testutil) were never extracted.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Cancel superseded pull request runs only; every push to main and every
# scheduled run is analysed to the end.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false

      # Modules only: the traced build always compiles from scratch, so a warm
      # build cache can never leave packages out of the extraction.
      - if: matrix.language == 'go'
        name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-codeql-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-codeql-${{ steps.go.outputs.go-version }}-

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The CodeQL tracer hooks `go build` and extracts with the same tags;
      # EXTRACT_TESTS pulls in _test.go files, which are skipped by default.
      - if: matrix.language == 'go'
        name: Build Go (incl. tests and integration tag)
        env:
          CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: "true"
        run: go build -tags=integration ./...

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
