# ==========================================================
# Mnema Talk - docker compose
# ==========================================================
# You normally do not edit this file: settings live in .env (the setup assistant
# writes both, doc/quick-start.md).
#
# CONTENTS
#   1. app        the server: web app, API and voice (always on)
#   2. postgres   the database (always on)
#   3. seaweedfs  media storage (always on)
#   4. coturn     OPTIONAL external TURN server (profile: turn)
#   5. updater + recreator   OPTIONAL "Update now" button (profile: autoupdate)
#
# REQUIRED in .env: PUBLIC_URL, JWT_SECRET, POSTGRES_PASSWORD, S3_ACCESS_KEY,
# S3_SECRET_KEY, and ADMIN_INITIAL_PASSWORD on the first start. Compose stops
# at once when POSTGRES_PASSWORD or S3_SECRET_KEY is missing.
#
# PROFILES are optional services that start only when enabled: put
# COMPOSE_PROFILES=autoupdate,turn (pick what you need) in .env, or run
# docker compose --profile autoupdate up -d. See doc/updating.md.
#
# Images are pinned by tag and digest; Dependabot refreshes both weekly.
# Container logs rotate at 3 x 10 MB per service instead of growing forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================================
  # 1. App: Mnema Talk (Go + Vue 3 Embedded + Pion SFU)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Default: built on this host. To run (and self-update) a released image,
    # set MNEMA_IMAGE in .env, e.g. ghcr.io/msch128/mnema-talk:X.Y (follows the
    # patch releases of one minor line; see the releases page for X.Y) or
    # :latest, and start with `docker compose pull app && docker compose up -d`
    # instead of --build. The setup assistant writes this for you
    # (doc/quick-start.md); updating: doc/updating.md.
    image: ${MNEMA_IMAGE:-mnema-talk:local}
    container_name: mnema-talk
    restart: unless-stopped
    labels:
      # Only containers with BOTH labels may be touched by the optional
      # updater sidecar (profile autoupdate): it runs with --label-enable and
      # --scope mnema-talk. postgres, seaweedfs and coturn carry neither.
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mnema-talk"
    ports:
      # The web app and API. Loopback only by default, so that the only way in
      # is your reverse proxy (it holds the HTTPS certificate and must pass
      # WebSockets; doc/reverse-proxy.md). Never forward this port on your
      # router. Set PUBLISH_ADDR=0.0.0.0 (or a LAN address) only when the proxy
      # runs in another container or on another machine.
      - "${PUBLISH_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
      # Voice, video and screen share. Browsers send these UDP packets straight
      # to the server; the reverse proxy does not carry them. Forward the whole
      # range on your router (doc/ports.md); in the default mode all calls share its first port.
      # WEBRTC_PUBLISH_ADDR=127.0.0.1 keeps voice on this computer (a trial).
      - "${WEBRTC_PUBLISH_ADDR:-0.0.0.0}:${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}:${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}/udp"
      # The TURN relay built into the app (WEBRTC_BUILTIN_TURN, default auto:
      # it runs while WEBRTC_TURN_URLS is empty). It lets members whose network
      # blocks the UDP range above reach voice through one port, UDP and TCP.
      # Forward this port in your router like the range above.
      # Port 3479 (UDP and TCP), not coturn's 3478, so both can run on one host.
      # With WEBRTC_TURN_URLS set, "auto" keeps the relay off; TURN_PUBLISH_ADDR=127.0.0.1
      # also stops Docker from publishing the port.
      - "${TURN_PUBLISH_ADDR:-0.0.0.0}:${WEBRTC_BUILTIN_TURN_PORT:-3479}:${WEBRTC_BUILTIN_TURN_PORT:-3479}/udp"
      - "${TURN_PUBLISH_ADDR:-0.0.0.0}:${WEBRTC_BUILTIN_TURN_PORT:-3479}:${WEBRTC_BUILTIN_TURN_PORT:-3479}/tcp"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      # Empty = PUBLIC_URL only.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Proxies whose X-Forwarded-For is trusted: empty = loopback only. Set
      # it to your reverse proxy's address (its container IP, the Docker
      # bridge gateway for a proxy on this host, or its LAN address), never
      # a whole private range: any host in a trusted range can forge its IP and
      # evade rate limits and the login lockout.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS:-720}
      - DATABASE_URL=postgres://${POSTGRES_USER:-mnema}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mnema_talk}?sslmode=disable
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mnema-media}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-mnema_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      - S3_FORCE_PATH_STYLE=true
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - EMOJI_MAX=${EMOJI_MAX:-200}
      - UPLOAD_QUOTA_MB_PER_DAY=${UPLOAD_QUOTA_MB_PER_DAY:-2048}
      - MEDIA_MAX_TOTAL_MB=${MEDIA_MAX_TOTAL_MB:-0}
      - MEDIA_MIN_FREE_MB=${MEDIA_MIN_FREE_MB:-1024}
      - MEDIA_DISK_PATH=${MEDIA_DISK_PATH:-}
      - LINK_PREVIEWS_ENABLED=${LINK_PREVIEWS_ENABLED:-true}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      - PUSH_ENABLED=${PUSH_ENABLED:-true}
      - PUSH_PREVIEWS=${PUSH_PREVIEWS:-user}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-}
      - WEBHOOK_ALLOW_PRIVATE_TARGETS=${WEBHOOK_ALLOW_PRIVATE_TARGETS:-}
      # Release check against api.github.com every 30 min; false = no request.
      - UPDATE_CHECK_ENABLED=${UPDATE_CHECK_ENABLED:-true}
      # Compare the server clock with NTP for the admin Status tab.
      - CLOCK_CHECK_ENABLED=${CLOCK_CHECK_ENABLED:-true}
      # Self-update through the updater sidecar (profile autoupdate). Empty
      # UPDATER_TOKEN = no "update now" button. The app gets no Docker access.
      - UPDATER_URL=${UPDATER_URL:-http://mnema-updater:8080}
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
      - MNEMA_IMAGE=${MNEMA_IMAGE:-mnema-talk:local}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # 0 = automatic media deletion OFF. Keep it off unless you really want pruning.
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-0}
      # 0 = keep audit log entries forever.
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-0}
      # 0 = keep the earlier versions of edited messages (moderator edit history).
      - EDIT_HISTORY_RETENTION_DAYS=${EDIT_HISTORY_RETENTION_DAYS:-0}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # Empty = the server default (de); `mnema-talk setup` writes the choice.
      - INITIAL_LANGUAGE=${INITIAL_LANGUAGE:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - WEBRTC_UDP_PORT_MIN=${WEBRTC_UDP_PORT_MIN:-50000}
      - WEBRTC_UDP_PORT_MAX=${WEBRTC_UDP_PORT_MAX:-50050}
      # Empty = WEBRTC_UDP_PORT_MIN (one shared port for all peers).
      - WEBRTC_UDP_MUX_PORT=${WEBRTC_UDP_MUX_PORT:-}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
      # This host's LAN address, announced after the detected public one.
      - WEBRTC_LAN_IP=${WEBRTC_LAN_IP:-}
      # Empty NAT_1TO1_IP: find the public IPv4 with a STUN request at startup.
      - WEBRTC_AUTO_ANNOUNCE=${WEBRTC_AUTO_ANNOUNCE:-true}
      - WEBRTC_DETECT_STUN_URLS=${WEBRTC_DETECT_STUN_URLS:-}
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS:-}
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:-}
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - WEBRTC_BUILTIN_TURN=${WEBRTC_BUILTIN_TURN:-auto}
      - WEBRTC_BUILTIN_TURN_PORT=${WEBRTC_BUILTIN_TURN_PORT:-3479}
      - WEBRTC_BUILTIN_TURN_HOST=${WEBRTC_BUILTIN_TURN_HOST:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - PPROF_ADDR=${PPROF_ADDR:-}
      - VOICE_UPLOAD_LIMIT_MBIT=${VOICE_UPLOAD_LIMIT_MBIT:-0}
      # Outgoing e-mail (confirm an address, reset a password). Empty SMTP_HOST =
      # the server sends no e-mail. SMTP_PASSWORD_FILE needs the file mounted.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_PASSWORD_FILE=${SMTP_PASSWORD_FILE:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - LEGAL_OPERATOR_NAME=${LEGAL_OPERATOR_NAME:-Community Operator}
      - LEGAL_OPERATOR_EMAIL=${LEGAL_OPERATOR_EMAIL:-admin@example.com}
      - LEGAL_OPERATOR_COUNTRY=${LEGAL_OPERATOR_COUNTRY:-}
      - LEGAL_PROJECT_NOTICE=${LEGAL_PROJECT_NOTICE:-}
    # The app writes nothing to disk: uploads stream to S3 in 5 MB parts.
    # /tmp is a small RAM-backed scratch area, capped like everything else.
    read_only: true
    tmpfs:
      - /tmp:size=${APP_TMP_SIZE:-64m}
    # Runs as uid 10001 on unprivileged ports: no capabilities needed.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # The server sets its Go memory limit to 85% of this (internal/memlimit).
    mem_limit: ${APP_MEM_LIMIT:-1g}
    pids_limit: 512
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - mnema-network
      # Only the app and the updater sidecar are on this internal network.
      - mnema-updater

  # ==========================================================
  # 2. Database: PostgreSQL 18
  # ==========================================================
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: mnema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mnema_talk}
      # Set only by scripts/upgrade-postgres.sh for its one-time import.
      MNEMA_PG_UPGRADE: ${MNEMA_PG_UPGRADE:-}
    # PostgreSQL 18 keeps its data in a version directory under
    # /var/lib/postgresql, on a new volume. The PostgreSQL 17 volume of older
    # versions is only mounted read-only to notice an install that was not
    # upgraded yet: then this refuses to start (instead of serving an empty
    # or partially imported database) until scripts/upgrade-postgres.sh has
    # verified the import and written its completion marker.
    entrypoint:
      - sh
      - -c
      - |
        if [ -s /var/lib/postgresql/17-data/PG_VERSION ] && [ "$$MNEMA_PG_UPGRADE" != 1 ] && [ "$$(cat /var/lib/postgresql/.mnema-pg17-upgrade-complete 2>/dev/null)" != mnema-postgres17-upgrade-v1 ]; then
          echo "PostgreSQL 17 data from an older Mnema Talk found, but no verified PostgreSQL 18 upgrade yet." >&2
          echo "Run ./scripts/upgrade-postgres.sh in the deployment directory (doc/upgrade.md)." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres18-data:/var/lib/postgresql
      - postgres-data:/var/lib/postgresql/17-data:ro
    # The entrypoint starts as root to fix ownership of the data directory,
    # then drops to the postgres user: only the capabilities for that.
    # Everything but the data volume is read-only; the socket directory and
    # /tmp are small RAM-backed scratch areas.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run/postgresql:size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnema} -d ${POSTGRES_DB:-mnema_talk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mnema-network

  # ==========================================================
  # 3. Object Storage: SeaweedFS (S3-compatible)
  # ==========================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: mnema-seaweedfs
    restart: unless-stopped
    environment:
      # The S3 gateway only accepts these credentials (the same ones the app
      # uses). Without an identity config SeaweedFS would allow anonymous
      # access to every bucket from anywhere on the Docker network.
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-mnema_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    # Writes the S3 identity config from the environment, then starts the
    # all-in-one server (master, volume, filer, S3 gateway) with it.
    entrypoint:
      - sh
      - -c
      - |
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY" in
          *[!A-Za-z0-9._~+/=-]*)
            echo "S3_ACCESS_KEY and S3_SECRET_KEY may only contain letters, digits and . _ ~ + / = -" >&2
            exit 1 ;;
        esac
        if [ -z "$$S3_ACCESS_KEY" ] || [ "$${#S3_SECRET_KEY}" -lt 8 ]; then
          echo "S3_ACCESS_KEY and S3_SECRET_KEY (at least 8 characters) must be set" >&2
          exit 1
        fi
        umask 077
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "mnema",
              "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -s3 -s3.port=8333 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweedfs-data:/data
    # Writes only to /data and /tmp (the S3 identity file). It runs as root
    # (existing volumes hold root-owned files) and needs DAC_OVERRIDE only
    # because the image's /data directory belongs to another user.
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${SEAWEEDFS_MEM_LIMIT:-1g}
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      # Master and S3 gateway (the port the app talks to) must both answer.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mnema-network

  # ==========================================================
  # 4. OPTIONAL TURN Relay: coturn (profile: turn)
  # ==========================================================
  # The app has a TURN relay of its own (WEBRTC_BUILTIN_TURN) that needs
  # nothing but the forwarded port. coturn is the alternative for operators who
  # want a separate relay process or public relay ports; set WEBRTC_TURN_URLS
  # for it (the built-in relay then stays off under "auto") and move the app's
  # relay port, see the comment on the app's ports above.
  # Enable with: docker compose --profile turn up -d
  # Router port forward required: 3478 UDP/TCP (TCP serves browsers that may
  # not use UDP, e.g. Opera with its VPN or WebRTC protection); 49152-49200 UDP
  # only for relaying to peers outside the LAN.
  coturn:
    image: coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    container_name: mnema-coturn
    restart: unless-stopped
    profiles:
      - turn
    network_mode: host
    logging: *default-logging
    environment:
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - WEBRTC_TURN_REALM=${WEBRTC_TURN_REALM:-turn.example.com}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
    # Allocation quotas: at most 8 relayed sessions per credential and 48 in
    # total (the relay port range below holds 49), so one member cannot take
    # every relay port.
    # Refuses to start without a real secret: with an empty static-auth-secret
    # anyone could mint credentials and use the relay.
    # Never relays into private, loopback, link-local or reserved ranges (incl.
    # their IPv4-mapped IPv6 form) nor to the server's own public IP, so the
    # relay cannot reach the NAS LAN, Docker networks or host services. The
    # one exception is the voice server itself: a private IP listed in
    # WEBRTC_NAT_1TO1_IP (its LAN address) is allowed, otherwise relayed
    # clients could never reach it.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#WEBRTC_TURN_SECRET}" -lt 16 ]; then
          echo "WEBRTC_TURN_SECRET must be at least 16 characters" >&2
          exit 1
        fi
        self=""
        for entry in $$(echo "$$WEBRTC_NAT_1TO1_IP" | tr ',' ' '); do
          case "$$entry" in
            10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*)
              # Relay from (and allow) only the voice server's LAN address, never
              # a Docker or VPN interface the voice server cannot reach.
              self="$$self --allowed-peer-ip=$$entry --relay-ip=$$entry" ;;
            *[!0-9.]*) ;; # a host name, e.g. dynamic DNS: nothing to add
            *) self="$$self --denied-peer-ip=$$entry" ;;
          esac
        done
        exec turnserver -n --use-auth-secret \
          --static-auth-secret="$$WEBRTC_TURN_SECRET" --realm="$$WEBRTC_TURN_REALM" \
          --listening-port=3478 --min-port=49152 --max-port=49200 \
          --fingerprint --no-cli --no-multicast-peers --no-tcp-relay \
          --user-quota=8 --total-quota=48 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=240.0.0.0-255.255.255.255 \
          --denied-peer-ip=::-::1 \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255 \
          --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          $$self

  # ==========================================================
  # 5. OPTIONAL self-update (profile: autoupdate): updater + recreator
  # ==========================================================
  # Enable with: docker compose --profile autoupdate up -d
  # plus UPDATER_TOKEN in .env (openssl rand -hex 32). It lets an admin
  # update the app from the System tab ("update now", with password).
  #
  # Two containers:
  #   updater   (this project's cmd/updater, started from the app image)
  #             checks that the new image was built and signed by this
  #             repository's release workflow (cosign signature + SLSA
  #             provenance), then pulls exactly the verified digest and points
  #             the local tag at it. A failed check changes nothing and the
  #             admin is told.
  #   recreator (Watchtower, no-pull) restarts the app from that local image.
  #
  # SECURITY: both hold the Docker socket, which is root on the host. That is
  # why they are separate, opt-in containers and the app never gets Docker
  # access. They
  #   - only touch containers labelled enable=true AND scope=mnema-talk (the
  #     app; never postgres/seaweedfs/coturn or anything else on the host),
  #   - never update on their own: no schedule, only POST /v1/update with the
  #     bearer token,
  #   - publish no port; the updater alone has internet access (image registry
  #     and Sigstore), the recreator none (internal network),
  #   - re-pull the tag the app runs (MNEMA_IMAGE); they never switch tags and
  #     refuse any image not signed by the pinned release identity.
  # nicholas-fedor/watchtower is the maintained fork of containrrr/watchtower
  # (archived December 2025). Pinned by version and multi-arch digest.
  updater:
    image: ${MNEMA_IMAGE:-mnema-talk:local}
    container_name: mnema-updater
    entrypoint: ["/usr/local/bin/mnema-updater"]
    restart: unless-stopped
    # Longer than the updater's 2 minute wait for a running swap, so a stop
    # does not SIGKILL it between retagging and recreating the app.
    stop_grace_period: 3m
    profiles:
      - autoupdate
    # The Docker socket is root:docker 660; uid 0 without capabilities can use it.
    user: "0:0"
    environment:
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
      - UPDATER_RECREATOR_URL=http://mnema-recreator:8080
      # Only for a fork with its own release images (doc/operations.md).
      - UPDATER_IMAGE_REPOSITORY=${UPDATER_IMAGE_REPOSITORY:-}
      - UPDATER_CERT_IDENTITY_REGEXP=${UPDATER_CERT_IDENTITY_REGEXP:-}
      - UPDATER_CERT_ISSUER=${UPDATER_CERT_ISSUER:-}
      - UPDATER_SOURCE_URL=${UPDATER_SOURCE_URL:-}
      # Optional trusted_root.json (mount it) for hosts that cannot reach Sigstore's TUF mirror.
      - UPDATER_TRUSTED_ROOT=${UPDATER_TRUSTED_ROOT:-}
    labels:
      # Same scope, but no enable label: it never updates itself.
      - "com.centurylinklabs.watchtower.scope=mnema-talk"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging
    depends_on:
      - recreator
    networks:
      - mnema-updater
      - mnema-recreator
      - mnema-updater-egress

  recreator:
    image: nickfedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    container_name: mnema-recreator
    restart: unless-stopped
    profiles:
      - autoupdate
    environment:
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
      # Watchtower refuses to start the HTTP API without a token.
      - WATCHTOWER_HTTP_API_TOKEN=${UPDATER_TOKEN:-}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      # Never pulls: the updater has verified the image and moved the local tag.
      - WATCHTOWER_NO_PULL=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=mnema-talk
      # Remove the replaced image afterwards (roll back by pinning an older tag).
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
    labels:
      - "com.centurylinklabs.watchtower.scope=mnema-talk"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    networks:
      - mnema-recreator

volumes:
  postgres18-data:
    driver: local
  # PostgreSQL 17 data of versions before 0.5, kept read-only after the
  # upgrade (rollback); empty on new installs.
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local

networks:
  mnema-network:
    name: mnema-network
    driver: bridge
  # App <-> updater only. internal: no route to the internet or the host LAN.
  mnema-updater:
    name: mnema-updater
    driver: bridge
    internal: true
  # Updater <-> recreator only, also internal.
  mnema-recreator:
    name: mnema-recreator
    driver: bridge
    internal: true
  # The updater's way out to the image registry and Sigstore; nothing else is
  # attached to it.
  mnema-updater-egress:
    name: mnema-updater-egress
    driver: bridge
