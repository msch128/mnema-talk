# Images are pinned by tag and digest; Dependabot refreshes both weekly.
# Container logs rotate at 3 x 10 MB per service instead of growing forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================================
  # Mnema Talk Application (Go + Vue 3 Embedded + Pion SFU)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Default: built on this host. To run (and self-update) a released image,
    # set MNEMA_IMAGE in .env, e.g. ghcr.io/msch128/mnema-talk:0.4 (follows
    # 0.4.x) or :latest, and start with `docker compose pull app && docker
    # compose up -d` instead of --build. See README, "Updates".
    image: ${MNEMA_IMAGE:-mnema-talk:local}
    container_name: mnema-talk
    restart: unless-stopped
    labels:
      # Only containers with BOTH labels may be touched by the optional
      # updater sidecar (profile autoupdate): it runs with --label-enable and
      # --scope mnema-talk. postgres, seaweedfs and coturn carry neither.
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=mnema-talk"
    ports:
      - "${PORT:-8080}:8080"
      - "${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}:${WEBRTC_UDP_PORT_MIN:-50000}-${WEBRTC_UDP_PORT_MAX:-50050}/udp"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      # Empty = PUBLIC_URL only.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Proxies whose X-Forwarded-For is trusted. The app itself defaults to
      # loopback only; in compose, a reverse proxy on the host (through the
      # published port) or in a container reaches the app from the Docker
      # bridge, which Docker allocates from 172.16.0.0/12 by default. Set it
      # to your proxy's address if it runs on another LAN host or the Docker
      # network uses a different subnet.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS:-720}
      - DATABASE_URL=postgres://${POSTGRES_USER:-mnema}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mnema_talk}?sslmode=disable
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mnema-media}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-mnema_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      - S3_FORCE_PATH_STYLE=true
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - LINK_PREVIEWS_ENABLED=${LINK_PREVIEWS_ENABLED:-true}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      # Release check against api.github.com every 30 min; false = no request.
      - UPDATE_CHECK_ENABLED=${UPDATE_CHECK_ENABLED:-true}
      # Self-update through the updater sidecar (profile autoupdate). Empty
      # UPDATER_TOKEN = no "update now" button. The app gets no Docker access.
      - UPDATER_URL=${UPDATER_URL:-http://mnema-updater:8080}
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
      - MNEMA_IMAGE=${MNEMA_IMAGE:-mnema-talk:local}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # 0 = automatic media deletion OFF. Keep it off unless you really want pruning.
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-0}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Herzog}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - WEBRTC_UDP_PORT_MIN=${WEBRTC_UDP_PORT_MIN:-50000}
      - WEBRTC_UDP_PORT_MAX=${WEBRTC_UDP_PORT_MAX:-50050}
      # Empty = WEBRTC_UDP_PORT_MIN (one shared port for all peers).
      - WEBRTC_UDP_MUX_PORT=${WEBRTC_UDP_MUX_PORT:-}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS:-}
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:-}
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - LEGAL_OPERATOR_NAME=${LEGAL_OPERATOR_NAME:-Community Operator}
      - LEGAL_OPERATOR_EMAIL=${LEGAL_OPERATOR_EMAIL:-admin@example.com}
      - LEGAL_OPERATOR_COUNTRY=${LEGAL_OPERATOR_COUNTRY:-Deutschland}
      - LEGAL_PROJECT_NOTICE=${LEGAL_PROJECT_NOTICE:-Privates, nicht-kommerzielles Projekt}
    # The app writes nothing to disk: uploads stream to S3 in 5 MB parts.
    # /tmp is a small RAM-backed scratch area, capped like everything else.
    read_only: true
    tmpfs:
      - /tmp:size=${APP_TMP_SIZE:-64m}
    # Runs as uid 10001 on unprivileged ports: no capabilities needed.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${APP_MEM_LIMIT:-1g}
    pids_limit: 512
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - mnema-network
      # Only the app and the updater sidecar are on this internal network.
      - mnema-updater

  # ==========================================================
  # Database: PostgreSQL 18
  # ==========================================================
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: mnema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mnema_talk}
      # Set only by scripts/upgrade-postgres.sh for its one-time import.
      MNEMA_PG_UPGRADE: ${MNEMA_PG_UPGRADE:-}
    # PostgreSQL 18 keeps its data in a version directory under
    # /var/lib/postgresql, on a new volume. The PostgreSQL 17 volume of older
    # versions is only mounted read-only to notice an install that was not
    # upgraded yet: then this refuses to start (instead of serving an empty
    # or partially imported database) until scripts/upgrade-postgres.sh has
    # verified the import and written its completion marker.
    entrypoint:
      - sh
      - -c
      - |
        if [ -s /var/lib/postgresql/17-data/PG_VERSION ] && [ "$$MNEMA_PG_UPGRADE" != 1 ] && [ "$$(cat /var/lib/postgresql/.mnema-pg17-upgrade-complete 2>/dev/null)" != mnema-postgres17-upgrade-v1 ]; then
          echo "PostgreSQL 17 data from an older Mnema Talk found, but no verified PostgreSQL 18 upgrade yet." >&2
          echo "Run ./scripts/upgrade-postgres.sh in the deployment directory (doc/upgrade.md)." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres18-data:/var/lib/postgresql
      - postgres-data:/var/lib/postgresql/17-data:ro
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnema} -d ${POSTGRES_DB:-mnema_talk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mnema-network

  # ==========================================================
  # Object Storage: SeaweedFS (S3-compatible)
  # ==========================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: mnema-seaweedfs
    restart: unless-stopped
    environment:
      # The S3 gateway only accepts these credentials (the same ones the app
      # uses). Without an identity config SeaweedFS would allow anonymous
      # access to every bucket from anywhere on the Docker network.
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-mnema_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    # Writes the S3 identity config from the environment, then starts the
    # all-in-one server (master, volume, filer, S3 gateway) with it.
    entrypoint:
      - sh
      - -c
      - |
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY" in
          *[!A-Za-z0-9._~+/=-]*)
            echo "S3_ACCESS_KEY and S3_SECRET_KEY may only contain letters, digits and . _ ~ + / = -" >&2
            exit 1 ;;
        esac
        if [ -z "$$S3_ACCESS_KEY" ] || [ "$${#S3_SECRET_KEY}" -lt 8 ]; then
          echo "S3_ACCESS_KEY and S3_SECRET_KEY (at least 8 characters) must be set" >&2
          exit 1
        fi
        umask 077
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "mnema",
              "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -s3 -s3.port=8333 -s3.config=/tmp/s3.json -dir=/data
    volumes:
      - seaweedfs-data:/data
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${SEAWEEDFS_MEM_LIMIT:-1g}
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      # Master and S3 gateway (the port the app talks to) must both answer.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mnema-network

  # ==========================================================
  # Optional TURN Relay: coturn (profile: turn)
  # ==========================================================
  # Enable with: docker compose --profile turn up -d
  # Router port forward required: 3478 UDP/TCP (TCP serves browsers that may
  # not use UDP, e.g. Opera with its VPN or WebRTC protection); 49152-49200 UDP
  # only for relaying to peers outside the LAN.
  coturn:
    image: coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    container_name: mnema-coturn
    restart: unless-stopped
    profiles:
      - turn
    network_mode: host
    logging: *default-logging
    environment:
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - WEBRTC_TURN_REALM=${WEBRTC_TURN_REALM:-turn.example.com}
      - WEBRTC_NAT_1TO1_IP=${WEBRTC_NAT_1TO1_IP:-}
    # Refuses to start without a real secret: with an empty static-auth-secret
    # anyone could mint credentials and use the relay.
    # Never relays into private, loopback, link-local or reserved ranges (incl.
    # their IPv4-mapped IPv6 form) nor to the server's own public IP, so the
    # relay cannot reach the NAS LAN, Docker networks or host services. The
    # one exception is the voice server itself: a private IP listed in
    # WEBRTC_NAT_1TO1_IP (its LAN address) is allowed, otherwise relayed
    # clients could never reach it.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#WEBRTC_TURN_SECRET}" -lt 16 ]; then
          echo "WEBRTC_TURN_SECRET must be at least 16 characters" >&2
          exit 1
        fi
        self=""
        for entry in $$(echo "$$WEBRTC_NAT_1TO1_IP" | tr ',' ' '); do
          case "$$entry" in
            10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*)
              # Relay from (and allow) only the voice server's LAN address, never
              # a Docker or VPN interface the voice server cannot reach.
              self="$$self --allowed-peer-ip=$$entry --relay-ip=$$entry" ;;
            *[!0-9.]*) ;; # a host name, e.g. dynamic DNS: nothing to add
            *) self="$$self --denied-peer-ip=$$entry" ;;
          esac
        done
        exec turnserver -n --use-auth-secret \
          --static-auth-secret="$$WEBRTC_TURN_SECRET" --realm="$$WEBRTC_TURN_REALM" \
          --listening-port=3478 --min-port=49152 --max-port=49200 \
          --fingerprint --no-cli --no-multicast-peers --no-tcp-relay \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=240.0.0.0-255.255.255.255 \
          --denied-peer-ip=::-::1 \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255 \
          --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          $$self

  # ==========================================================
  # Optional updater sidecar: Watchtower (profile: autoupdate)
  # ==========================================================
  # Enable with: docker compose --profile autoupdate up -d
  # plus UPDATER_TOKEN in .env (openssl rand -hex 32). It lets an admin
  # update the app from the System tab ("update now", with password).
  #
  # SECURITY: this container holds the Docker socket, which is root on the
  # host. That is why it is a separate, opt-in container and the app never
  # gets Docker access. It
  #   - only updates containers labelled enable=true AND scope=mnema-talk
  #     (the app; never postgres/seaweedfs/coturn or anything else on the host),
  #   - never updates on its own: no schedule, only POST /v1/update with the
  #     bearer token (WATCHTOWER_HTTP_API_PERIODIC_POLLS=false),
  #   - publishes no port and sits only on the internal "mnema-updater"
  #     network shared with the app (no other container, no internet; image
  #     pulls are done by the Docker daemon, not by this container),
  #   - re-pulls the tag the app runs (MNEMA_IMAGE); it never switches tags.
  # nicholas-fedor/watchtower is the maintained fork of containrrr/watchtower
  # (archived December 2025). Pinned by version and multi-arch digest.
  updater:
    image: nickfedor/watchtower:1.23.0@sha256:45b54f6dc15227cfb38dbb826f2881aa0f56aaf0c255cdbb38bd80e598bdca9a
    container_name: mnema-updater
    restart: unless-stopped
    profiles:
      - autoupdate
    environment:
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
      # Watchtower refuses to start the HTTP API without a token.
      - WATCHTOWER_HTTP_API_TOKEN=${UPDATER_TOKEN:-}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=mnema-talk
      # Remove the replaced image afterwards (roll back by pinning an older tag).
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
    labels:
      # Same scope, but no enable label: it never updates itself.
      - "com.centurylinklabs.watchtower.scope=mnema-talk"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    networks:
      - mnema-updater

volumes:
  postgres18-data:
    driver: local
  # PostgreSQL 17 data of versions before 0.5, kept read-only after the
  # upgrade (rollback); empty on new installs.
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local

networks:
  mnema-network:
    name: mnema-network
    driver: bridge
  # App <-> updater only. internal: no route to the internet or the host LAN.
  mnema-updater:
    name: mnema-updater
    driver: bridge
    internal: true
