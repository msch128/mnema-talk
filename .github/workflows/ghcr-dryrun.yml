name: GHCR dry run (org move)

# Throwaway, never merged: proves that this repository's workflow can push to
# ghcr.io/mnema-xyz/mnema-talk with GHCR_MNEMA_XYZ_TOKEN, that a copy by
# digest keeps the index (provenance and SBOM attestations) and that the
# release signature travels along. Runs only on pushes to this branch.
on:
  push:
    branches: ['org-move/ghcr-dryrun']

permissions:
  contents: read
  packages: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: ghcr.io/msch128/mnema-talk
      TARGET: ghcr.io/mnema-xyz/mnema-talk
      VERSION: 3.1.1
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR as msch128 (cross-owner token)
        env:
          TOKEN: ${{ secrets.GHCR_MNEMA_XYZ_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::GHCR_MNEMA_XYZ_TOKEN is not set"; exit 1; }
          printf '%s' "$TOKEN" | docker login ghcr.io -u msch128 --password-stdin
          printf '%s' "$TOKEN" | cosign login ghcr.io -u msch128 --password-stdin

      - name: Copy by digest, with the signature
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$SOURCE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "source $SOURCE:$VERSION = $digest"
          cosign verify "$SOURCE@$digest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/msch128/mnema-talk/\.github/workflows/release\.yml@refs/heads/main$' >/dev/null
          docker buildx imagetools create --tag "$TARGET:dryrun-$VERSION" "$SOURCE@$digest"
          # GHCR has no referrers API: cosign keeps the signature bundles in the
          # referrers tag schema, an index tagged sha256-<hex>. Copy that index too.
          hex=${digest#sha256:}
          docker buildx imagetools inspect --raw "$SOURCE:sha256-$hex" | jq -r '.manifests[] | .artifactType + " " + .digest'
          docker buildx imagetools create --tag "$TARGET:sha256-$hex" "$SOURCE:sha256-$hex"
          got=$(docker buildx imagetools inspect "$TARGET:dryrun-$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$got" = "$digest" ] || { echo "::error::digest $got, expected $digest"; exit 1; }
          cosign verify "$TARGET@$digest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/msch128/mnema-talk/\.github/workflows/release\.yml@refs/heads/main$' >/dev/null
          docker buildx imagetools inspect "$TARGET:dryrun-$VERSION" --format '{{json .Provenance}}' | jq -e '.' >/dev/null
          docker buildx imagetools inspect "$TARGET:dryrun-$VERSION" --format '{{json .SBOM}}' | jq -e '.' >/dev/null
          {
            echo "### Dry run"
            echo "$TARGET:dryrun-$VERSION = $digest (same as $SOURCE:$VERSION)"
            echo "signature verified at the new path; provenance and SBOM present"
          } >> "$GITHUB_STEP_SUMMARY"
