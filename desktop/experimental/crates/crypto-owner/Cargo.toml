[package]
name="mnema-private-native-crypto-owner"
version="0.0.0"
edition="2024"
publish=false
[features]
default=[]
opaque-relay=[]
synthetic-two-peer-fixture=["opaque-relay","mnema-private-native-client-broker/synthetic-transport-fixture"]
[dependencies]
mnema-private-native-trust-dialog={path="../trust-dialog"}
mnema-private-first-community-bootstrap={path="../checked-storage/bootstrap"}
mnema-crypto-enrollment-prototype={path="../crypto-stack/crypto-enrollment"}
base64="=0.22.1"
serde_json="=1.0.151"
mnema-crypto-sdk-prototype={path="qualified-sdk"}
mnema-crypto-adapter-candidate={path="../crypto-stack/crypto-adapter"}
mnema-private-native-client-broker={path="../broker"}
uuid={version="=1.27.0",features=["v4","serde"]}
zeroize="=1.9.1"
sha2="=0.10.9"
serde={version="=1.0.229",features=["derive"]}

[dev-dependencies]
mnema-private-first-community-bootstrap={path="../checked-storage/bootstrap"}
mnema-crypto-enrollment-prototype={path="../crypto-stack/crypto-enrollment"}
openmls={path="../../vendor/openmls/openmls"}
serde_json="=1.0.151"
tempfile="=3.23.0"
tokio={version="=1.53.2",features=["rt","time"]}
getrandom="=0.3.4"
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework="=3.7.0"
security-framework-sys="=2.17.0"
core-foundation="=0.10.1"
[[example]]
name="two_native_peers"
path="examples/two_native_peers.rs"
required-features=["synthetic-two-peer-fixture"]
