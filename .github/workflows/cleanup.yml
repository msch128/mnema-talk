# One-off maintenance: removes all tags and earlier runs of this workflow. Started by hand; delete this file afterwards.
name: Cleanup

on:
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SELF: ${{ github.run_id }}
    steps:
      - name: Delete tags
        run: |
          for ref in $(gh api --paginate "repos/$REPO/git/matching-refs/tags" --jq '.[].ref'); do
            gh api -X DELETE "repos/$REPO/git/$ref" && echo "$ref deleted" || echo "::warning::$ref not deleted"
          done

      - name: Delete earlier cleanup runs
        run: |
          for id in $(gh api --paginate "repos/$REPO/actions/workflows/cleanup.yml/runs" --jq '.workflow_runs[].id'); do
            [ "$id" = "$SELF" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "run $id deleted" || echo "::warning::run $id not deleted"
          done
