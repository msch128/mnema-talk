name: Media group sweep

# The nightly sweeps, too slow for the pull request pipeline. A failed run is
# the alert.
#   sweep, availability: the simulator of the media group protocol on seeds
#     1..400, both relays, against the failure budget in
#     web/src/lib/media/groupSim.known.fixture.ts (it may only shrink) and the
#     availability table in groupAvailability.fixture.ts (pooled over all shards).
#   powers, clocks, cycle, explore, crash: the same protocol under a relay that
#     replays and lies about the roster, under clocks that are off, drift and
#     step, the recurrence of room states, every script of a small room, and a
#     tab that dies at an await boundary (lists in groupSweep.known.fixture.ts).
#   links: generated messages judged by automod and rendered by the client; no
#     rule may let a link the client opens through
#     (web/src/shared/lib/markdown/linkParity.sweep.test.ts).
#   sfu: the SFU's resource bounds in deep mode (internal/sfu).
#   trust: the desktop update trust chain model on generated sequences
#     (internal/webbundle/trustchain_test.go).
#   races: the deep race and crash-point sweeps of the server and the jobs
#     against the shutdown drain.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Sweep shard ${{ matrix.shard }} of 8
        env:
          SIM_SWEEP: "1"
          SIM_SHARD: ${{ matrix.shard }}/8
          SIM_POOL_OUT: ${{ runner.temp }}/pool
        run: npx vitest run src/lib/media/groupSim.sweep.test.ts
      - name: Keep the shard's availability sums for the pooled budget
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pool-${{ matrix.shard }}
          path: ${{ runner.temp }}/pool
          if-no-files-found: error
          # A rerun of one shard replaces its upload; the content is deterministic.
          overwrite: true
          retention-days: 7

  # The hard limit of the availability budget: all 400 seeds of both relays pooled
  # (LOST_BUDGET.pooled in groupAvailability.fixture.ts). A shard off its own row of the
  # table is only a warning in that shard's summary: a single shard swings with any timing change.
  availability:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pool-*
          merge-multiple: true
          path: ${{ runner.temp }}/pool
      - name: Pooled availability of all shards
        env:
          SIM_POOL_DIR: ${{ runner.temp }}/pool
        run: npx vitest run src/lib/media/groupAvailability.pool.test.ts

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Link sweep shard ${{ matrix.shard }} of 4, as older desktop bundles render
        env:
          LINK_SWEEP: "1"
          LINK_SWEEP_N: "4000000"
          LINK_SHARD: ${{ matrix.shard }}/4
        run: npx vitest run src/shared/lib/markdown/linkParity.sweep.test.ts
      - name: Link sweep shard ${{ matrix.shard }} of 4, as this bundle renders
        env:
          LINK_SWEEP: "1"
          LINK_SWEEP_N: "1000000"
          LINK_SHARD: ${{ matrix.shard }}/4
          LINK_SWEEP_CLIENT: current
        run: npx vitest run src/shared/lib/markdown/linkParity.sweep.test.ts

  powers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Server powers (replay of every kind, roster lies) shard ${{ matrix.shard }} of 4
        env:
          SIM_POWERS: "1"
          SIM_POWERS_SEEDS: "1..200"
          SIM_SHARD: ${{ matrix.shard }}/4
        run: npx vitest run src/lib/media/groupPowers.sweep.test.ts

  clocks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Clocks per member (offset, drift, wall steps) shard ${{ matrix.shard }} of 4
        env:
          SIM_CLOCKS: "1"
          SIM_CLOCKS_SEEDS: "1..120"
          SIM_SHARD: ${{ matrix.shard }}/4
        run: npx vitest run src/lib/media/groupClocks.sweep.test.ts

  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Recurrence of the room state shard ${{ matrix.shard }} of 2
        env:
          SIM_CYCLE: "1"
          SIM_SHARD: ${{ matrix.shard }}/2
        run: npx vitest run src/lib/media/groupCycle.sweep.test.ts

  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Small rooms, every schedule to a bound shard ${{ matrix.shard }} of 4
        env:
          SIM_EXPLORE: "1"
          SIM_EXPLORE_MEMBERS: "2"
          SIM_EXPLORE_DEPTH: "2"
          SIM_EXPLORE_POINTS: "30"
          SIM_SHARD: ${{ matrix.shard }}/4
        run: npx vitest run src/lib/media/groupExplore.sweep.test.ts

  crash:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Crash points of 2 members shard ${{ matrix.shard }} of 8
        env:
          SIM_CRASH: "1"
          SIM_CRASH_MEMBERS: "2"
          SIM_CRASH_MAX: "400"
          SIM_SHARD: ${{ matrix.shard }}/8
        run: npx vitest run src/lib/media/groupCrash.sweep.test.ts

  sfu:
    # Deep SFU growth probes (lane 8, shape 7): env-gated tests that are too
    # heavy for the pull request pipeline. TestUnhandledSRTCPStreamsAreCapped
    # floods two member connections with 50 000 unknown SSRCs each and holds
    # each to the cap on unread SRTCP streams (H-L8-07).
    # TestSubscriptionSwitchesRetainNothing switches one subscription on and
    # off 2000 times and bounds the heap growth per switch (H-L8-09). A failed
    # run of the whole job is the alert.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Unhandled SRTCP SSRC cap
        env:
          SFU_SSRC_FLOOD_DEEP: "1"
        run: go test ./internal/sfu/ -run TestUnhandledSRTCPStreamsAreCapped -count=1 -timeout 15m -v
      - name: Subscription switch heap slope
        env:
          SFU_SUB_SLOPE: "1"
        run: go test ./internal/sfu/ -run TestSubscriptionSwitchesRetainNothing -count=1 -timeout 15m -v

  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Trust chain sweep shard ${{ matrix.shard }} of 4
        env:
          WEBBUNDLE_TRUST_SWEEP: "200000"
          WEBBUNDLE_TRUST_SHARD: ${{ matrix.shard }}/4
        run: go test -count=1 -timeout 25m -run '^TestTrustChainSequences$' ./internal/webbundle/

  # Limits and "only one" under callers released together, and an operation
  # with each of its statements failing in turn (internal/testutil/racetest,
  # internal/server/crash_points_integration_test.go). Known failures are
  # inverse assertions: a sweep that stops reproducing one fails.
  races:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mnema
          POSTGRES_PASSWORD: mnema
          POSTGRES_DB: mnema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnema -d mnema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the service container above.
      TEST_DATABASE_URL: postgres://mnema:mnema@localhost:5432/mnema_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Race and crash-point sweeps, deep
        env:
          RACE_SWEEP: "1"
        run: >-
          go test -tags=integration -p=1 -count=1 -timeout 50m
          -run 'Parallel|BothSides|EveryFailingStatement|AReplyPinnedDuringTheSweep|AnEditAndADelete|AMemberWhoLeft|AModeratorsDeleteThatWaited|TheEndOfALifetimeRaces|DeletingAWebhook'
          ./internal/auth/ ./internal/auth/authn/ ./internal/communityevents/ ./internal/wiki/ ./internal/server/
      - name: Jobs against the shutdown drain, under the race detector
        env:
          MNEMA_DRAIN_HAMMER: "1"
        run: go test -race -p=1 -count=1 -timeout 5m -run '^TestDrainHammer$' ./internal/auth/authn/
